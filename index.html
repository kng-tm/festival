<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRコード入場券照会</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface-sunken: #FAF8F3;
    --border: #E2DDD1;
    --text: #1E2126;
    --text-dim: #767065;
    --accent: #1F3B57;
    --accent-soft: rgba(31,59,87,0.08);
    --success: #1F8A5F;
    --danger: #C0392B;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 40px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .brand .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
  }

  .card{
    position: relative;
    width:100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px 26px;
    box-shadow: 0 16px 40px -24px rgba(30,33,38,0.25);
  }

  .mute-btn{
    position: absolute;
    top: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-sunken);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .mute-btn:hover{ background: var(--accent-soft); }
  .mute-btn:active{ transform: scale(0.94); }

  /* ---- 認証完了までスキャン画面を隠すオーバーレイ ---- */
  .auth-overlay{
    position: absolute;
    inset: 0;
    background: var(--surface);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 20;
    color: var(--text-dim);
    font-size: 14px;
  }
  .spinner-lg{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .subtitle{
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
    line-height:1.5;
  }

  /* ---- ログインフォーム ---- */
  .field{ margin-bottom: 14px; margin-top: 20px; }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .field input{
    width:100%;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input::placeholder{ color: #B5AE9F; }
  .field input:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field-hint{
    margin: 6px 2px 0;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .btn-primary{
    width:100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn-primary:hover{ filter: brightness(1.15); }
  .btn-primary:active{ transform: scale(0.98); }

  .error-msg{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top: 14px;
    padding: 11px 13px;
    background: rgba(192,57,43,0.07);
    border: 1px solid rgba(192,57,43,0.25);
    border-radius: 9px;
    color: var(--danger);
    font-size: 13px;
    line-height:1.4;
  }
  .error-msg::before{
    content:"!";
    flex-shrink:0;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--danger);
    color: #FFFFFF;
    font-size: 11px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .hidden{ display:none !important; }

  /* ---- スキャン画面全体の枠 ---- */
  .scan-frame{
    position: relative;
    width:100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  #reader{
    width:100% !important;
    background: var(--surface) !important;
  }

  #reader__scan_region{
    aspect-ratio: 1 / 1 !important;
    overflow: hidden !important;
    position: relative !important;
    background: #10131A !important;
  }
  #reader__scan_region video{
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }
  #reader img{ display:none; }

  /* html5-qrcode標準の白い縁取りを、デザインのアクセント色に変更 */
  div#qr-shaded-region > div{
    background-color: var(--accent) !important;
  }

  #reader__dashboard{
    background: var(--surface) !important;
    padding: 14px 4px 4px !important;
    color: var(--text-dim) !important;
    font-family: 'Inter', sans-serif !important;
  }
  #html5-qrcode-button-camera-stop,
  #html5-qrcode-button-camera-start{
    background: var(--accent) !important;
    color: #FFFFFF !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 10px 18px !important;
    font-family: 'Space Grotesk', sans-serif !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    cursor: pointer !important;
  }

  /* ---- 照会結果（画面上部に固定表示） ---- */
  .result-box{
    padding: 18px 18px 16px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 22px;
    min-height: 88px;
  }
  .result-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .result-label .pulse{
    width:7px; height:7px; border-radius:50%;
    background: var(--success);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(0.7); }
  }

  .loading-row{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 0;
  }
  .spinner{
    width:15px; height:15px;
    border-radius:50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .res-name{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .res-name.placeholder-row{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-dim);
  }
  .res-dept{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }

  .lottery-banner{
    position: relative;
    margin-top: 16px;
    padding: 20px 16px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #FFFFFF;
    background: linear-gradient(120deg, #FF6B6B, #FFB347, #FFD93D, #6BCB77, #4D96FF, #FF6BCB, #FF6B6B);
    background-size: 400% 400%;
    box-shadow: 0 8px 24px -6px rgba(255, 140, 60, 0.55), 0 0 0 3px rgba(255,255,255,0.4) inset;
    overflow: hidden;
    animation:
      lotteryPop 0.6s cubic-bezier(.36,1.56,.64,1),
      lotteryShimmer 2.5s linear infinite,
      lotteryGlow 1.1s ease-in-out infinite;
  }
  .lottery-banner::before{
    content: "✨";
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    animation: sparkleSpin 1.6s linear infinite;
  }
  .lottery-banner::after{
    content: "✨";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    animation: sparkleSpin 1.6s linear infinite reverse;
  }
  @keyframes lotteryPop{
    0%{ transform: scale(0.6) rotate(-4deg); opacity: 0; }
    55%{ transform: scale(1.12) rotate(2deg); opacity: 1; }
    75%{ transform: scale(0.97) rotate(-1deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  @keyframes lotteryShimmer{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 400% 50%; }
  }
  @keyframes lotteryGlow{
    0%, 100%{ box-shadow: 0 8px 24px -6px rgba(255, 140, 60, 0.55), 0 0 0 3px rgba(255,255,255,0.4) inset; }
    50%{ box-shadow: 0 8px 34px -4px rgba(255, 140, 60, 0.85), 0 0 0 3px rgba(255,255,255,0.7) inset; }
  }
  @keyframes sparkleSpin{
    0%{ transform: translateY(-50%) rotate(0deg) scale(1); }
    50%{ transform: translateY(-50%) rotate(180deg) scale(1.3); }
    100%{ transform: translateY(-50%) rotate(360deg) scale(1); }
  }

  .res-error{
    color: var(--danger);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
  }

  .badge{
    display: inline-block;
    margin-top: 10px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
  }
  .badge-ok{
    background: rgba(31,138,95,0.1);
    color: var(--success);
    border: 1px solid rgba(31,138,95,0.3);
  }
  .badge-warn{
    background: rgba(232,179,57,0.12);
    color: #8A6512;
    border: 1px solid rgba(232,179,57,0.4);
  }

  /* ---- スキャン画面下部：タイトル・説明文・ブランド ---- */
  .header-bottom{
    margin-top: 22px;
    text-align: center;
  }
  .header-bottom .brand{
    justify-content: center;
    margin-top: 14px;
  }

  /* 未送信があるときだけ出る小さな送信ボタン。件数までは出さない */
  .pending-btn{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 10px;
    padding: 3px 9px;
    border: 1px solid rgba(217,162,27,0.55);
    border-radius: 999px;
    background: rgba(217,162,27,0.12);
    color: #8A6512;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    cursor: pointer;
    transition: background .12s ease;
  }
  .pending-btn::before{
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #D9A21B;
  }
  .pending-btn:hover{ background: rgba(217,162,27,0.22); }
  .pending-btn:disabled{
    opacity: 0.65;
    cursor: default;
  }

  /* ---- 名前検索画面 ---- */
  .btn-secondary{
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    background: var(--surface);
    color: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .btn-secondary:hover{ background: var(--accent-soft); }

  #search-input{
    width: 100%;
    margin-top: 18px;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-sunken);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  #search-input:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #search-status{
    font-size: 12px;
    color: var(--text-dim);
    margin: 8px 2px 14px;
  }

  .result-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .result-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .result-item:hover{
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .result-item .r-name{
    font-weight: 600;
    font-size: 15px;
  }
  .result-item .r-sub{
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .chip{
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .chip-checked{
    background: rgba(31,138,95,0.1);
    color: var(--success);
  }
  .chip-unchecked{
    background: rgba(118,112,101,0.12);
    color: var(--text-dim);
  }
  .empty-note{
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 16px 0;
  }
</style>
</head>
<body>

  <div class="card">

    <!-- ログイン画面 -->
    <div id="login-area">
      <div class="brand" style="margin-bottom:18px;"><span class="dot"></span>SECURE CHECK-IN</div>
      <h1>QRコード入場券照会</h1>
      <p class="subtitle">配布されたアカウントでログインし、QRコードをスキャンしてください。</p>

      <div class="field">
        <label for="login-id">ID</label>
        <input id="login-id" type="text" placeholder="user ID" autocomplete="username" lang="en"
               inputmode="email" pattern="[A-Za-z0-9]*" autocapitalize="off" autocorrect="off" spellcheck="false">
        <p class="field-hint">半角英数字で入力してください</p>
      </div>
      <div class="field">
        <label for="login-pw">パスワード</label>
        <input id="login-pw" type="password" placeholder="••••••••" autocomplete="current-password"
               inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"
               onkeydown="if(event.key==='Enter') onLoginClick()">
      </div>

      <button class="btn-primary" onclick="onLoginClick()">ログインしてスキャン開始</button>
      <div id="login-error" class="error-msg hidden"></div>
    </div>

    <!-- 仮アカウントの初回設定画面 -->
    <div id="setup-area" class="hidden">
      <h1>アカウントの設定</h1>
      <p class="subtitle">初回ログインのため、ご自身の情報を設定してください。設定後、仮IDと初期パスワードは使用できなくなります。</p>

      <div class="field">
        <label for="setup-name">名前</label>
        <input id="setup-name" type="text" placeholder="受付スタッフの氏名" autocomplete="name">
      </div>
      <div class="field">
        <label for="setup-id">新しいID</label>
        <input id="setup-id" type="text" placeholder="半角英数字4文字以上" autocomplete="off"
               inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="setup-pw">新しいパスワード</label>
        <input id="setup-pw" type="password" placeholder="半角英数字8文字以上" autocomplete="new-password"
               inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="setup-pw2">パスワード（確認）</label>
        <input id="setup-pw2" type="password" placeholder="もう一度入力" autocomplete="new-password"
               inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"
               onkeydown="if(event.key==='Enter') onSetupSubmit()">
      </div>

      <button class="btn-primary" onclick="onSetupSubmit()">設定する</button>
      <div id="setup-error" class="error-msg hidden"></div>
    </div>

    <!-- スキャン画面：照会結果を最上部に固定表示、タイトル・ブランドは下部 -->
    <div id="scan-area" class="hidden">

      <!-- 認証が完了するまで、この上に重なってカメラ映像・結果を隠す -->
      <div id="auth-overlay" class="auth-overlay hidden">
        <span class="spinner-lg"></span>
        <p id="auth-overlay-message">認証しています…</p>
      </div>

      <button id="mute-toggle" class="mute-btn" onclick="toggleMute()" aria-label="音声のオン・オフを切り替え" type="button">🔊</button>

      <div id="result-box" class="result-box">
        <div id="loading" class="loading-row hidden">
          <span class="spinner"></span> 照会中...
        </div>
        <div id="info">
          <div class="result-label"><span class="pulse"></span>照会結果</div>
          <p class="res-name placeholder-row" id="res-name">QRコードをスキャンしてください</p>
          <p class="res-dept" id="res-dept"></p>
          <div id="lottery-banner" class="lottery-banner hidden">🎉 おめでとうございます 🎉</div>
          <p id="res-badge"></p>
        </div>
      </div>

      <div class="scan-frame">
        <div id="reader"></div>
      </div>

      <div class="header-bottom">
        <h1>スキャン中</h1>
        <p class="subtitle">枠内にQRコードを収めてください。連続で読み取れます。</p>
        <button class="btn-secondary" onclick="openSearchView()">名前で検索して入場処理</button>
        <button class="btn-secondary" onclick="reloadRoster()">名簿を再取得</button>
        <div class="brand">
          <span class="dot"></span>SECURE CHECK-IN
          <button id="pending-flush" class="pending-btn hidden" onclick="manualFlush()" type="button">未送信あり · 送信</button>
        </div>
      </div>
    </div>

    <!-- 名前検索画面 -->
    <div id="search-area" class="hidden">
      <h1>名前で検索</h1>
      <p class="subtitle">QRコードが読み取れない場合に使用します。</p>

      <input id="search-input" type="text" placeholder="名前を入力..." autocomplete="off">
      <p id="search-status">読み込み中...</p>

      <div id="search-results" class="result-list"></div>

      <button class="btn-secondary" onclick="closeSearchView()">スキャン画面に戻る</button>
    </div>

  </div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbw7wPLL-AJHJrlnXsg9MgaS3mG5CD3ZoWoIj-tMMr0afF3j8hl4PgwCc5oBuvpJJf09/exec'; // ← GASを新しくデプロイするたびに、ここを実際の/execURLに書き換える
  let authToken = null;
  let scannerInstance = null;
  let authFailed = false;
  let isLookupInProgress = false;
  let lastScannedId = null;
  let lastScanTime = 0;
  let rosterData = null; // 名簿。ログイン時に1回だけ取得し、照会も名前検索もこれで完結させる
  const SCAN_COOLDOWN_MS = 2500; // 同一QRコードの連続誤検出を防ぐための間隔

  // ローカル照合は一瞬で終わるため、そのまま結果を出すと読み取れたことが分からない。
  // 「照会中...」を意図的に少しだけ挟んで、スキャンが通ったことを伝える
  const RESULT_DELAY_MS = 500;
  let resultDisplayTimer = null;
  let lookupGeneration = 0;

  /* ---- 通信処理（タイムアウトと自動再試行） ---- */
  const FETCH_MAX_RETRIES = 2;     // 初回を含めて最大3回試行する
  const FETCH_RETRY_WAIT_MS = 700; // 再試行までの待ち時間（回数に応じて伸ばす）
  const FETCH_TIMEOUT_MS = 10000;  // 1回あたりの上限。通常の照会は1秒前後なので十分な余裕がある

  /**
   * GASへのPOST通信。
   * 指定時間を過ぎても応答がなければ打ち切り、間隔をあけて自動的に再送する。
   * サーバーが正常に応答していれば（内容がエラーでも）再送はしない。
   *
   * onRetry: 再試行に入ったときに呼ばれる。画面表示の更新に使う。
   */
  async function postToGas(payload, onRetry) {
    let lastError = null;

    for (let attempt = 0; attempt <= FETCH_MAX_RETRIES; attempt++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timer);
        return await res.json();

      } catch (err) {
        clearTimeout(timer);
        lastError = err;
        // AbortErrorはタイムアウトによる打ち切りを意味する
        const reason = (err.name === 'AbortError') ? 'タイムアウト' : err.message;
        console.error('[通信失敗 ' + (attempt + 1) + '回目]', err.name, reason);

        if (attempt < FETCH_MAX_RETRIES) {
          if (onRetry) onRetry(attempt + 1);
          // 少し待ってから再試行する（瞬間的な不調を吸収するため）
          await new Promise(r => setTimeout(r, FETCH_RETRY_WAIT_MS * (attempt + 1)));
        }
      }
    }

    throw lastError;
  }

  /* ==========================================================
   * チェックインの送信キュー
   * ==========================================================
   * 照会そのものは端末内の名簿で完結させ、
   * 「誰をチェックインしたか」だけをここに溜めて、
   * 一定件数または一定時間ごとにまとめて送信する。
   * これによりサーバーへのリクエスト数を大幅に減らしている。
   * ========================================================== */
  const QUEUE_FLUSH_SIZE = 10;            // この件数に達したら送信する
  const QUEUE_FLUSH_INTERVAL_MS = 120000; // 溜まったままでも、この間隔で必ず送信する（2分）
  const QUEUE_STORAGE_KEY = 'qr_pending_checkins';

  let pendingCheckIns = [];   // 未送信のID
  let isFlushingQueue = false;
  let flushTimer = null;

  function loadPendingFromStorage() {
    try {
      const saved = localStorage.getItem(QUEUE_STORAGE_KEY);
      if (!saved) return;

      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed)) return;

      // 今キューにある分を上書きしないよう、重複を避けて結合する
      parsed.forEach(function (id) {
        if (pendingCheckIns.indexOf(id) === -1) pendingCheckIns.push(id);
      });
    } catch (e) {
      // 壊れた内容が残っていても動作は継続させる
    }
  }

  function savePendingToStorage() {
    try {
      if (pendingCheckIns.length) {
        localStorage.setItem(QUEUE_STORAGE_KEY, JSON.stringify(pendingCheckIns));
      } else {
        localStorage.removeItem(QUEUE_STORAGE_KEY);
      }
    } catch (e) {
      // 保存できなくても動作自体は継続させる
    }
  }

  const PENDING_BTN_LABEL = '未送信あり · 送信';

  function updatePendingIndicator() {
    const el = document.getElementById('pending-flush');
    if (!el) return;

    el.classList.toggle('hidden', pendingCheckIns.length === 0);

    // 送信中は「送信中...」などの表示を出しているので、ここでは上書きしない
    if (!isFlushingQueue) {
      el.disabled = false;
      el.textContent = PENDING_BTN_LABEL;
    }
  }

  /**
   * 未送信分をその場で送る。
   * 自動送信を待たずに片付けたいときのための手動操作。
   */
  async function manualFlush() {
    const el = document.getElementById('pending-flush');
    if (!el || isFlushingQueue || !pendingCheckIns.length) return;

    el.disabled = true;
    el.textContent = '送信中...';

    const before = pendingCheckIns.length;
    await flushCheckInQueue();

    if (pendingCheckIns.length >= before) {
      // 送れずにキューへ戻った
      el.textContent = '送信できません';
      setTimeout(updatePendingIndicator, 1800);
    } else {
      updatePendingIndicator();
    }
  }

  function enqueueCheckIn(id) {
    pendingCheckIns.push(String(id));
    savePendingToStorage();
    updatePendingIndicator();

    if (pendingCheckIns.length >= QUEUE_FLUSH_SIZE) {
      flushCheckInQueue();
    }
  }

  /**
   * 溜まったチェックインをまとめて送信する。
   * 送信に失敗した場合はキューに戻し、次の機会に再送する。
   */
  async function flushCheckInQueue() {
    if (isFlushingQueue || !pendingCheckIns.length || !authToken) return;

    isFlushingQueue = true;
    // 送信中に新たなスキャンがあってもよいよう、対象を切り出しておく
    const sending = pendingCheckIns.slice();
    pendingCheckIns = [];
    savePendingToStorage();
    updatePendingIndicator();

    try {
      const data = await postToGas({ action: 'bulkCheckIn', token: authToken, ids: sending });

      if (!data.success) {
        // サーバー側で拒否された場合も、記録を失わないようキューに戻す
        pendingCheckIns = sending.concat(pendingCheckIns);
        console.error('[チェックイン記録失敗]', data.message);
      }
    } catch (err) {
      pendingCheckIns = sending.concat(pendingCheckIns);
      console.error('[チェックイン送信失敗]', err.name, err.message);
    } finally {
      savePendingToStorage();
      updatePendingIndicator();
      isFlushingQueue = false;
    }
  }

  function startQueueTimer() {
    if (flushTimer) clearInterval(flushTimer);
    flushTimer = setInterval(flushCheckInQueue, QUEUE_FLUSH_INTERVAL_MS);
  }

  // 画面を閉じる・別アプリに切り替える直前に、溜まっている分を送っておく
  window.addEventListener('pagehide', function () {
    if (pendingCheckIns.length && authToken && navigator.sendBeacon) {
      try {
        navigator.sendBeacon(
          GAS_URL,
          new Blob(
            [JSON.stringify({ action: 'bulkCheckIn', token: authToken, ids: pendingCheckIns })],
            { type: 'text/plain' }
          )
        );
        // 送信できたと確定はできないため、キューはあえて消さない。
        // 重複して届いても、サーバー側は同じ行をTRUEにするだけなので害はない。
      } catch (e) {
        // 送信できなくても、localStorageに残っているので次回起動時に再送される
      }
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) flushCheckInQueue();
  });

  // ---- 通知音（Web Audio APIでその場で合成。外部音源ファイルは一切使用しない） ----
  let audioCtx = null;
  let isMuted = sessionStorage.getItem('qr_scanner_muted') === 'true';

  function initAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
  }

  function playTone(frequency, duration, type, delay, volume) {
    if (isMuted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = frequency;

    const startTime = audioCtx.currentTime + (delay || 0);
    gain.gain.setValueAtTime(volume || 0.15, startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playSuccessSound() {
    // 明るく上昇する2音のチャイム
    playTone(880.0, 0.12, 'sine', 0, 0.16);
    playTone(1318.5, 0.16, 'sine', 0.09, 0.16);
  }

  function playErrorSound() {
    // 低めの2音のブザー
    playTone(220, 0.16, 'square', 0, 0.10);
    playTone(180, 0.22, 'square', 0.14, 0.10);
  }

  function playLotterySound() {
    // 抽選対象向けの、華やかな上昇アルペジオ＋きらめく高音の重ね鳴らし
    const notes = [523.3, 659.3, 783.9, 987.8, 1318.5, 1567.98]; // C5,E5,G5,B5,E6,G6
    notes.forEach((freq, i) => {
      playTone(freq, 0.22, 'triangle', i * 0.07, 0.22);
    });
    // 最後にきらめく和音を重ねる
    playTone(1568.0, 0.35, 'sine', 0.42, 0.14);
    playTone(2093.0, 0.35, 'sine', 0.46, 0.12);
    playTone(2637.0, 0.4, 'sine', 0.5, 0.10);
  }

  function toggleMute() {
    isMuted = !isMuted;
    sessionStorage.setItem('qr_scanner_muted', String(isMuted));
    updateMuteButton();
  }

  function updateMuteButton() {
    const btn = document.getElementById('mute-toggle');
    if (!btn) return;
    btn.textContent = isMuted ? '🔇' : '🔊';
    btn.setAttribute('aria-label', isMuted ? 'ミュート中（クリックで解除）' : '音声オン（クリックでミュート）');
  }
  updateMuteButton(); // 初期表示に反映

  // IDフィールド:全角英数字を自動的に半角に変換し、それ以外の文字は除去
  // IME(日本語入力)の変換中に割り込むと候補選択が壊れるため、
  // 確定タイミング(compositionend)でのみサニタイズを行う
  const loginIdInput = document.getElementById('login-id');
  let isComposing = false;

  function sanitizeIdValue(el) {
    const before = el.value;
    const after = before
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
      .replace(/[^A-Za-z0-9]/g, '');
    if (before !== after) {
      el.value = after;
    }
  }

  loginIdInput.addEventListener('compositionstart', function () {
    isComposing = true; // IME入力中は何もしない(変換候補を壊さないため)
  });

  loginIdInput.addEventListener('compositionend', function (e) {
    isComposing = false;
    sanitizeIdValue(e.target); // 確定した瞬間にまとめて変換
  });

  loginIdInput.addEventListener('input', function (e) {
    if (isComposing) return; // IME変換中は素通りさせる
    sanitizeIdValue(e.target); // 直接入力・貼り付け等はこれまで通り即座に変換
  });

  loginIdInput.addEventListener('blur', function (e) {
    sanitizeIdValue(e.target); // 念のため、フォーカスが外れた時にも最終チェック
  });

  function onLoginClick() {
    const id = document.getElementById('login-id').value;
    const pw = document.getElementById('login-pw').value;

    if (!id || !pw) {
      showLoginError('IDとパスワードを入力してください');
      return;
    }

    // IME等の影響で全角文字や不正な文字が紛れ込んでいないか、最終確認する
    if (!/^[A-Za-z0-9]+$/.test(id)) {
      showLoginError('IDは半角英数字で入力してください（日本語入力がオンになっていないか確認してください）');
      return;
    }

    document.getElementById('login-error').classList.add('hidden');
    authFailed = false;

    // AudioContextはユーザー操作の中で生成する必要があるため、ここで初期化する
    initAudio();

    // カメラをこのクリック操作の中で同期的に起動する（awaitを挟まない）
    document.getElementById('login-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
    document.getElementById('auth-overlay').classList.remove('hidden'); // 認証完了まで隠す
    startScanner();

    // 認証は裏で並行して進める
    doLogin(id, pw);
  }

  async function doLogin(id, pw) {
    if (!GAS_URL || !GAS_URL.startsWith('https://script.google.com/')) {
      authFailed = true;
      stopScannerAndReturnToLogin('システム設定エラー: GAS_URLが正しく設定されていません(管理者に連絡してください)');
      return;
    }

    try {
      const data = await postToGas({ action: 'login', id: id, password: pw });

      if (data.success) {
        authToken = data.token;
        sessionStorage.setItem('auth_token', authToken);

        if (data.isProvisional) {
          // 仮アカウントの場合はスキャン画面に進ませず、設定画面へ強制遷移する
          goToSetupView();
          return;
        }

        // 照会は端末内の名簿で行うため、名簿が揃うまでスキャン画面は見せない
        const msgEl = document.getElementById('auth-overlay-message');
        const ok = await loadRoster(function (text) { msgEl.textContent = text; });

        if (!ok) {
          authFailed = true;
          stopScannerAndReturnToLogin('名簿を取得できませんでした。もう一度お試しください');
          return;
        }

        // 前回の端末終了時に送りきれなかった分があれば、ここで送る
        loadPendingFromStorage();
        updatePendingIndicator();
        startQueueTimer();
        flushCheckInQueue();

        msgEl.textContent = '認証しています…'; // 次回のために戻しておく
        document.getElementById('auth-overlay').classList.add('hidden'); // 名簿が揃った、カメラ画面を表示
      } else {
        authFailed = true;
        stopScannerAndReturnToLogin(data.message);
      }
    } catch (err) {
      // 切り分け用：実際のエラー内容をコンソールに出す
      console.error('[ログイン通信失敗]', err.name, err.message, err);
      authFailed = true;
      stopScannerAndReturnToLogin('通信エラーが発生しました');
    }
  }

  function stopScannerAndReturnToLogin(message) {
    if (scannerInstance) {
      scannerInstance.clear().catch(() => {});
      scannerInstance = null;
    }

    // 表示待ちの結果が残っていれば取り消す
    if (resultDisplayTimer) {
      clearTimeout(resultDisplayTimer);
      resultDisplayTimer = null;
    }
    lookupGeneration++;
    isLookupInProgress = false;

    // 未送信の記録が残っていれば、画面を離れる前に送っておく
    flushCheckInQueue();
    if (flushTimer) {
      clearInterval(flushTimer);
      flushTimer = null;
    }

    rosterData = null; // セッションが変わるため名簿を破棄
    document.getElementById('setup-area').classList.add('hidden');
    document.getElementById('search-area').classList.add('hidden');
    document.getElementById('auth-overlay').classList.add('hidden'); // 次回のためにリセット
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('login-area').classList.remove('hidden');
    showLoginError(message);
  }

  function showLoginError(message) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = message;
    errEl.classList.remove('hidden');
  }

  function startScanner() {
    scannerInstance = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: 230,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] // 画像ファイル読込は使用しない
      }
    );
    scannerInstance.render((decodedText) => {
      if (authFailed || isLookupInProgress) return;

      const now = Date.now();
      // 同じQRコードを短時間に連続検出した場合は無視する（連続スキャンのための誤検出防止）
      if (decodedText === lastScannedId && (now - lastScanTime) < SCAN_COOLDOWN_MS) {
        return;
      }
      lastScannedId = decodedText;
      lastScanTime = now;

      lookupUser(decodedText);
      // pause/resumeは行わない：カメラを止めず、連続で次のQRコードを検出し続ける
    });
  }

  /* ---- 仮アカウントの初回設定 ---- */

  function goToSetupView() {
    // 起動済みのカメラを止めてから設定画面へ切り替える
    if (scannerInstance) {
      scannerInstance.clear().catch(() => {});
      scannerInstance = null;
    }
    document.getElementById('auth-overlay').classList.add('hidden');
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('login-area').classList.add('hidden');
    document.getElementById('setup-error').classList.add('hidden');
    document.getElementById('setup-name').value = '';
    document.getElementById('setup-id').value = '';
    document.getElementById('setup-pw').value = '';
    document.getElementById('setup-pw2').value = '';
    document.getElementById('setup-area').classList.remove('hidden');
  }

  function showSetupError(message) {
    const el = document.getElementById('setup-error');
    el.textContent = message;
    el.classList.remove('hidden');
  }

  async function onSetupSubmit() {
    const newName = document.getElementById('setup-name').value.trim();
    const newId = document.getElementById('setup-id').value.trim();
    const pw1 = document.getElementById('setup-pw').value;
    const pw2 = document.getElementById('setup-pw2').value;

    document.getElementById('setup-error').classList.add('hidden');

    if (!newName) {
      showSetupError('名前を入力してください');
      return;
    }
    if (!/^[A-Za-z0-9]+$/.test(newId)) {
      showSetupError('IDは半角英数字のみで入力してください');
      return;
    }
    if (newId.length < 4) {
      showSetupError('IDは4文字以上にしてください');
      return;
    }
    if (!/^[A-Za-z0-9]+$/.test(pw1)) {
      showSetupError('パスワードは半角英数字のみで入力してください（日本語入力がオンになっていないか確認してください）');
      return;
    }
    if (pw1.length < 8) {
      showSetupError('パスワードは8文字以上にしてください');
      return;
    }
    if (pw1 !== pw2) {
      showSetupError('パスワードが一致しません');
      return;
    }

    try {
      const data = await postToGas({
        action: 'setupAccount',
        token: authToken,
        newName: newName,
        newId: newId,
        newPassword: pw1
      });

      if (data.success) {
        // 設定完了。仮IDと初期パスワードは無効になったので、ログイン画面に戻す
        authToken = null;
        sessionStorage.removeItem('auth_token');
        document.getElementById('setup-area').classList.add('hidden');
        document.getElementById('login-area').classList.remove('hidden');
        document.getElementById('login-id').value = newId; // 入力の手間を省く
        document.getElementById('login-pw').value = '';
        showLoginError('設定が完了しました。新しいIDとパスワードでログインしてください');
      } else {
        showSetupError(data.message);
      }
    } catch (err) {
      showSetupError('通信エラーが発生しました');
    }
  }

  /* ---- 名前検索画面 ---- */

  function openSearchView() {
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('search-area').classList.remove('hidden');
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';

    const statusEl = document.getElementById('search-status');
    statusEl.textContent = rosterData
      ? rosterData.length + '件から検索できます'
      : '名簿を読み込み中です...';

    document.getElementById('search-input').focus();
  }

  function closeSearchView() {
    document.getElementById('search-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
  }

  /**
   * 名簿を取得して端末内に保持する。
   * 照会も名前検索も、以降はこのデータだけで完結する。
   */
  async function loadRoster(onStatus) {
    if (onStatus) onStatus('名簿を読み込み中...');

    try {
      const data = await postToGas(
        { action: 'searchIndex', token: authToken },
        function (retryCount) {
          if (onStatus) onStatus('接続が不安定です。再試行中... (' + retryCount + '/' + FETCH_MAX_RETRIES + ')');
        }
      );

      if (data.success) {
        rosterData = data.list;
        // 入力のたびに全件を変換すると無駄なので、正規化済みの名前を事前に持たせておく
        rosterData.forEach(function (p) {
          p._searchKey = normalizeForSearch(p.name);
        });
        if (onStatus) onStatus(rosterData.length + '件から検索できます');
        return true;
      }

      if (onStatus) onStatus('読み込みに失敗しました: ' + data.message);
      return false;

    } catch (err) {
      console.error('[名簿の取得失敗]', err.name, err.message);
      if (onStatus) onStatus('名簿を取得できませんでした');
      return false;
    }
  }

  /**
   * 名簿を取り直す。
   * 受付中に申込が追加された場合に、再ログインせず反映させるためのもの。
   */
  async function reloadRoster() {
    const nameEl = document.getElementById('res-name');
    const deptEl = document.getElementById('res-dept');
    const badgeEl = document.getElementById('res-badge');

    document.getElementById('info').classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('lottery-banner').classList.add('hidden');
    nameEl.classList.add('placeholder-row');
    nameEl.innerText = '名簿を再取得しています...';
    deptEl.innerText = '';
    badgeEl.innerHTML = '';

    // この端末で記録済みの分は、取り直しても「照会済み」のままにしておく
    const checkedHere = {};
    if (rosterData) {
      rosterData.forEach(function (p) {
        if (p.checked) checkedHere[String(p.id)] = true;
      });
    }

    const ok = await loadRoster();

    if (ok) {
      rosterData.forEach(function (p) {
        if (checkedHere[String(p.id)]) p.checked = true;
      });
      nameEl.innerText = '名簿を再取得しました（' + rosterData.length + '件）';
    } else {
      nameEl.classList.remove('placeholder-row');
      nameEl.innerHTML = '<span class="res-error">名簿を再取得できませんでした</span>';
    }
  }

  // 日本語入力の変換中は検索を走らせない（変換候補が確定する前に絞り込むと結果が安定しないため）
  let isSearchComposing = false;
  const searchInputEl = document.getElementById('search-input');

  searchInputEl.addEventListener('compositionstart', function () {
    isSearchComposing = true;
  });

  searchInputEl.addEventListener('compositionend', function (e) {
    isSearchComposing = false;
    renderSearchResults(e.target.value.trim());
  });

  searchInputEl.addEventListener('input', function () {
    if (isSearchComposing) return;
    renderSearchResults(this.value.trim());
  });

  /**
   * 検索用に文字列を正規化する。
   * ひらがな・カタカナの違いや、全角半角の揺れを吸収して
   * 「たなか」でも「タナカ」でもヒットするようにする。
   */
  function normalizeForSearch(str) {
    if (!str) return '';

    return String(str)
      .normalize('NFKC')          // 半角カタカナ・全角英数を標準形に揃える
      .replace(/[ぁ-ゖ]/g, function (c) {
        // ひらがなをカタカナに変換して比較する
        return String.fromCharCode(c.charCodeAt(0) + 0x60);
      })
      .replace(/\s+/g, '')        // 空白の有無による差をなくす
      .toLowerCase();
  }

  function renderSearchResults(keyword) {
    const listEl = document.getElementById('search-results');
    listEl.innerHTML = '';

    if (!keyword || !rosterData) return;

    const normalizedKeyword = normalizeForSearch(keyword);

    const matches = rosterData
      .filter(p => (p._searchKey || '').includes(normalizedKeyword))
      .slice(0, 20);

    if (matches.length === 0) {
      listEl.innerHTML = '<p class="empty-note">該当する候補がありません</p>';
      return;
    }

    matches.forEach(p => {
      const item = document.createElement('div');
      item.className = 'result-item';
      item.innerHTML =
        '<div>' +
          '<div class="r-name"></div>' +
          '<div class="r-sub"></div>' +
        '</div>' +
        '<span class="chip ' + (p.checked ? 'chip-checked' : 'chip-unchecked') + '">' +
          (p.checked ? '照会済み' : '未照会') +
        '</span>';
      // 名前・メールはtextContentで入れることでHTMLとして解釈されないようにする
      item.querySelector('.r-name').textContent = p.name;
      item.querySelector('.r-sub').textContent =
        p.count + '名 ・ ' + maskEmail(p.email) + (p.isLottery ? ' ・ 🎉抽選対象' : '');

      item.addEventListener('click', function () { checkInFromSearch(p); });
      listEl.appendChild(item);
    });
  }

  /**
   * 同姓同名の判別に必要な最小限だけを見せる。
   * 例: tanaka.taro@example.com → ta***@example.com
   */
  function maskEmail(email) {
    if (!email) return 'メール未登録';
    const parts = String(email).split('@');
    if (parts.length !== 2) return '***';
    return parts[0].slice(0, 2) + '***@' + parts[1];
  }

  function checkInFromSearch(person) {
    // スキャン画面に戻してから、QRスキャンと全く同じ処理・演出を通す
    closeSearchView();

    // checkedの更新はlookupUser側で行う。
    // ここで先に立ててしまうと、初回なのに「照会済み」と表示されてしまう
    lookupUser(person.id);
  }

  /**
   * 照会処理。
   * 通信はせず、ログイン時に取得した端末内の名簿だけで完結させる。
   * チェックインの記録は送信キューに積み、後でまとめて送る。
   *
   * 判定と記録は即座に行うが、結果の表示だけは少し遅らせている。
   * ローカル照合は一瞬で終わるため、そのまま表示すると
   * 「読み取れたのか分からない」状態になってしまうため。
   */
  function lookupUser(qrId) {
    const loadingEl = document.getElementById('loading');
    const infoEl = document.getElementById('info');
    const nameEl = document.getElementById('res-name');
    const deptEl = document.getElementById('res-dept');
    const badgeEl = document.getElementById('res-badge');
    const lotteryBanner = document.getElementById('lottery-banner');

    // 表示待ちの結果があれば破棄し、この回の結果で上書きする
    const myGeneration = ++lookupGeneration;
    if (resultDisplayTimer) clearTimeout(resultDisplayTimer);

    // --- 判定と記録は遅らせずにここで確定させる ---
    let result;

    if (!rosterData) {
      result = { ok: false, message: '名簿を読み込み中です。少し待ってから再度スキャンしてください' };
    } else {
      const person = rosterData.find(p => String(p.id) === String(qrId));

      if (!person) {
        result = { ok: false, message: '対象者が見つかりません' };
      } else {
        // 名簿を取得した時点、またはこの端末で既に読んだかどうかで判定する
        const alreadyChecked = person.checked === true;
        person.checked = true;

        // 記録はキューに積むだけ。送信はまとめて行う
        enqueueCheckIn(person.id);

        result = { ok: true, person: person, alreadyChecked: alreadyChecked };
      }
    }

    // --- 「照会中...」を見せる ---
    isLookupInProgress = true;
    infoEl.classList.add('hidden');
    loadingEl.classList.remove('hidden');

    // --- 少し置いてから結果を出す ---
    resultDisplayTimer = setTimeout(function () {
      resultDisplayTimer = null;
      if (myGeneration !== lookupGeneration) return; // 新しいスキャンに追い越された

      loadingEl.classList.add('hidden');
      infoEl.classList.remove('hidden');
      nameEl.classList.remove('placeholder-row');

      if (!result.ok) {
        nameEl.innerHTML = '<span class="res-error">' + result.message + '</span>';
        deptEl.innerText = '';
        badgeEl.innerHTML = '';
        lotteryBanner.classList.add('hidden');
        playErrorSound();
        isLookupInProgress = false;
        return;
      }

      const person = result.person;

      nameEl.innerText = person.name;
      deptEl.innerText = '人数: ' + person.count + '名';

      badgeEl.innerHTML = result.alreadyChecked
        ? '<span class="badge badge-warn">⚠ 照会済み（再スキャン）</span>'
        : '<span class="badge badge-ok">✓ 新規照会</span>';

      if (person.isLottery) {
        // 再生のたびにアニメーションが走るよう、一度リセットしてから付け直す
        lotteryBanner.classList.remove('hidden');
        lotteryBanner.style.animation = 'none';
        void lotteryBanner.offsetWidth; // 強制リフロー(アニメーション再トリガーのため)
        lotteryBanner.style.animation = '';
        playLotterySound();
      } else {
        lotteryBanner.classList.add('hidden');
        playSuccessSound();
      }

      isLookupInProgress = false;
    }, RESULT_DELAY_MS);
  }
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRコード入場券照会</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface-sunken: #FAF8F3;
    --border: #E2DDD1;
    --text: #1E2126;
    --text-dim: #767065;
    --accent: #1F3B57;
    --accent-soft: rgba(31,59,87,0.08);
    --success: #1F8A5F;
    --danger: #C0392B;
    --radius: 14px;

    /* 結果パネルの下に確保する余白。
       iOS Safariの下部アドレスバーに中身が被らないようにするためのもの。
       実機を見て調整する想定。小さくすると被り、大きくするとパネルが間延びする */
    --sheet-safe-gap: 72px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 40px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .brand .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
  }

  .card{
    position: relative;
    width:100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px 26px;
    box-shadow: 0 16px 40px -24px rgba(30,33,38,0.25);
  }

  /* カメラ枠の中に置いて映像の上に重ねる。
     映像が明るくても暗くても読めるよう、半透明の暗い円に白い縁を付ける。
     枠の外に置くと、position:relativeな枠の方が後から描画されて隠れてしまう */
  .mute-btn{
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 10;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(16,19,26,0.55);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .mute-btn:hover{ background: rgba(16,19,26,0.78); }
  .mute-btn:active{ transform: scale(0.94); }

  /* ---- 認証完了までスキャン画面を隠すオーバーレイ ---- */
  .auth-overlay{
    position: absolute;
    inset: 0;
    background: var(--surface);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 20;
    color: var(--text-dim);
    font-size: 14px;
  }
  .spinner-lg{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .subtitle{
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
    line-height:1.5;
  }

  /* ---- ログインフォーム ---- */
  .field{ margin-bottom: 14px; margin-top: 20px; }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .field input{
    width:100%;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input::placeholder{ color: #B5AE9F; }
  .field input:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field-hint{
    margin: 6px 2px 0;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .btn-primary{
    width:100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn-primary:hover{ filter: brightness(1.15); }
  .btn-primary:active{ transform: scale(0.98); }

  .error-msg{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top: 14px;
    padding: 11px 13px;
    background: rgba(192,57,43,0.07);
    border: 1px solid rgba(192,57,43,0.25);
    border-radius: 9px;
    color: var(--danger);
    font-size: 13px;
    line-height:1.4;
  }
  .error-msg::before{
    content:"!";
    flex-shrink:0;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--danger);
    color: #FFFFFF;
    font-size: 11px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .hidden{ display:none !important; }

  /* ---- スキャン画面全体の枠 ---- */
  .scan-frame{
    position: relative;
    /* z-indexを与えて重なりの基準をここで閉じる。
       こうしないと、枠の中の要素が認証オーバーレイ(20)や結果パネル(50)より
       手前に出てしまうことがある */
    z-index: 1;
    width:100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  #reader{
    width:100% !important;
    background: var(--surface) !important;
  }

  #reader__scan_region{
    aspect-ratio: 1 / 1 !important;
    overflow: hidden !important;
    position: relative !important;
    background: #10131A !important;
  }
  #reader__scan_region video{
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }
  /* インカメラのときだけ左右を反転する（applyMirror_ が付け外しする）。
     反転するのは video だけ。#reader ごと反転すると、上に重なっている
     枠（qr-shaded-region）やボタンの文字まで裏返る */
  #reader__scan_region video.is-mirrored{
    transform: scaleX(-1);
  }
  #reader img{ display:none; }

  /* html5-qrcode標準の白い縁取りを、デザインのアクセント色に変更 */
  div#qr-shaded-region > div{
    background-color: var(--accent) !important;
  }

  #reader__dashboard{
    background: var(--surface) !important;
    padding: 14px 4px 4px !important;
    color: var(--text-dim) !important;
    font-family: 'Inter', sans-serif !important;
  }
  #html5-qrcode-button-camera-stop,
  #html5-qrcode-button-camera-start{
    background: var(--accent) !important;
    color: #FFFFFF !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 10px 18px !important;
    font-family: 'Space Grotesk', sans-serif !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    cursor: pointer !important;
  }

  /* ---- 照会結果（画面下部からせり上がるパネル） ----
     position:fixed なのでスクロール位置に一切依存せず、常に同じ場所に出る。
     確認ボタンが画面下部に来るため、片手でも親指が届く。
     カメラ映像を覆うのは結果が出ている間だけで、狙いを定めている最中は全面が見える */
  .result-sheet{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0 auto;
    max-width: 432px; /* カード(400) + 左右の余白(16×2) */
    z-index: 50;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -18px 44px -24px rgba(30,33,38,0.55);
    /* iOS Safariの下部アドレスバー対策。
       パネル自体は画面下端まで伸ばしたまま、内側に余白を取って中身を上に逃がす。
       バーの高さに合わせて動かす方法だと、スクロールでバーが伸縮するたびに
       パネルが上下してしまうため、固定の余白にして動かさないことを優先した。
       パネルの背景が下端まで続くので、隙間からカメラ映像が覗くこともない。

       --sheet-safe-gap が実機で大きすぎる・小さすぎる場合はこの値だけ調整する。
       max()にしているのは、ホームインジケータ用の余白と二重に足さないため */
    padding: 14px 20px calc(22px + max(var(--sheet-safe-gap), env(safe-area-inset-bottom, 0px)));
    transform: translateY(102%);
    transition: transform .24s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  .result-sheet.open{
    transform: translateY(0);
    pointer-events: auto;
  }
  /* 下から出てくるパネルであることを示すつまみ */
  .sheet-handle{
    width: 38px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin: 0 auto 14px;
  }
  /* 背面を少し暗くして、結果に目を向けさせる。
     確認待ちの間はスキャンが止まっているので、カメラが暗くなっても支障はない */
  .sheet-scrim{
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(30,33,38,0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .24s ease;
  }
  .sheet-scrim.open{ opacity: 1; }

  @media (prefers-reduced-motion: reduce){
    .result-sheet, .sheet-scrim{ transition: none; }
  }
  .result-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .result-label .pulse{
    width:7px; height:7px; border-radius:50%;
    background: var(--success);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(0.7); }
  }

  .loading-row{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 0;
  }
  .spinner{
    width:15px; height:15px;
    border-radius:50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .res-name{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .res-name.placeholder-row{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-dim);
  }
  .res-dept{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }

  .lottery-banner{
    position: relative;
    margin-top: 16px;
    padding: 20px 16px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #FFFFFF;
    background: linear-gradient(120deg, #FF6B6B, #FFB347, #FFD93D, #6BCB77, #4D96FF, #FF6BCB, #FF6B6B);
    background-size: 400% 400%;
    box-shadow: 0 8px 24px -6px rgba(255, 140, 60, 0.55), 0 0 0 3px rgba(255,255,255,0.4) inset;
    overflow: hidden;
    animation:
      lotteryPop 0.6s cubic-bezier(.36,1.56,.64,1),
      lotteryShimmer 2.5s linear infinite,
      lotteryGlow 1.1s ease-in-out infinite;
  }
  .lottery-banner::before{
    content: "✨";
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    animation: sparkleSpin 1.6s linear infinite;
  }
  .lottery-banner::after{
    content: "✨";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    animation: sparkleSpin 1.6s linear infinite reverse;
  }
  @keyframes lotteryPop{
    0%{ transform: scale(0.6) rotate(-4deg); opacity: 0; }
    55%{ transform: scale(1.12) rotate(2deg); opacity: 1; }
    75%{ transform: scale(0.97) rotate(-1deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  @keyframes lotteryShimmer{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 400% 50%; }
  }
  @keyframes lotteryGlow{
    0%, 100%{ box-shadow: 0 8px 24px -6px rgba(255, 140, 60, 0.55), 0 0 0 3px rgba(255,255,255,0.4) inset; }
    50%{ box-shadow: 0 8px 34px -4px rgba(255, 140, 60, 0.85), 0 0 0 3px rgba(255,255,255,0.7) inset; }
  }
  @keyframes sparkleSpin{
    0%{ transform: translateY(-50%) rotate(0deg) scale(1); }
    50%{ transform: translateY(-50%) rotate(180deg) scale(1.3); }
    100%{ transform: translateY(-50%) rotate(360deg) scale(1); }
  }

  .res-error{
    color: var(--danger);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
  }

  .badge{
    display: inline-block;
    margin-top: 10px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
  }
  .badge-ok{
    background: rgba(31,138,95,0.1);
    color: var(--success);
    border: 1px solid rgba(31,138,95,0.3);
  }
  .badge-warn{
    background: rgba(232,179,57,0.12);
    color: #8A6512;
    border: 1px solid rgba(232,179,57,0.4);
  }

  /* ---- スキャン画面下部：タイトル・説明文・ブランド ---- */
  .header-bottom{
    margin-top: 22px;
    text-align: center;
  }
  /* 補助ボタンを横並びにして、スクロールが必要な高さを減らす */
  .btn-row{
    display: flex;
    gap: 8px;
  }
  .btn-row .btn-secondary{
    flex: 1 1 0;
    min-width: 0;
  }
  .header-bottom .brand{
    justify-content: center;
    margin-top: 14px;
  }

  /* 結果を確認したことを明示してもらうためのボタン。押すまで次のスキャンに進まない */
  .btn-confirm{
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .12s ease, transform .12s ease;
  }
  .btn-confirm:hover{ filter: brightness(1.15); }
  .btn-confirm:active{ transform: scale(0.98); }

  /* 未送信があるときだけ出る小さな送信ボタン。件数までは出さない */
  /* 受付の終了など、エラーではない通知。枠は同じで色だけ変える */
  .error-msg.is-info{
    background: rgba(31,138,95,0.08);
    border-color: rgba(31,138,95,0.28);
    color: var(--success);
  }
  .error-msg.is-info::before{
    content: "\2713"; /* ✓ */
    background: var(--success);
  }

  .pending-btn{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    margin-left: 10px;
    padding: 3px 9px;
    border: 1px solid rgba(217,162,27,0.55);
    border-radius: 999px;
    background: rgba(217,162,27,0.12);
    color: #8A6512;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    cursor: pointer;
    transition: background .12s ease;
  }
  .pending-btn::before{
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #D9A21B;
  }
  .pending-btn:hover{ background: rgba(217,162,27,0.22); }
  .pending-btn:disabled{
    opacity: 0.65;
    cursor: default;
  }

  /* ---- 名前検索画面 ---- */
  .btn-secondary{
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    background: var(--surface);
    color: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .btn-secondary:hover{ background: var(--accent-soft); }

  /* 「受付を終了」だけ色を分ける。
     上の2つ（名前で検索・名簿を再取得）は受付作業の中で使うボタン、
     こちらは作業を終えるボタンで性質が違う。
     同じ見た目のまま並べると、押し間違いにも押し忘れにもつながる。
     塗りつぶしにしないのは、スキャン作業中に視線を奪わないため */
  .btn-finish{
    border-color: var(--danger);
    color: var(--danger);
  }
  .btn-finish:hover{ background: rgba(192,57,43,0.07); }

  /* ---- 接続先の表示 ---- */
  .target-line{
    margin: 0 0 18px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-sunken);
    color: var(--text-dim);
    font-size: 0.84rem;
    line-height: 1.5;
  }
  .target-line .target-name{
    color: var(--text);
    font-weight: 600;
  }
  /* 日付の不一致をここで警告することはしない。
     スタッフは接続先を変更できないので、警告を出しても取れる行動がなく、
     不安にさせるだけになる。
     接続先の名前が出ていれば「画面が11/14になっている」ことは分かるので、
     気づくための手がかりは残っている。
     切り替え忘れの警告は、管理シートのD1・管理ツール・毎朝の通知で出す */

  /* ---- 端末に残ったログインから再開する画面 ---- */
  .resume-card{
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 4px;
  }
  .resume-name{
    margin: 0;
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text);
  }
  .resume-note{
    margin: 5px 0 0;
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--text-dim);
  }


  #search-input{
    width: 100%;
    margin-top: 18px;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-sunken);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  #search-input:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #search-status{
    font-size: 12px;
    color: var(--text-dim);
    margin: 8px 2px 14px;
  }

  .result-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .result-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .result-item:hover{
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .result-item .r-name{
    font-weight: 600;
    font-size: 15px;
  }
  .result-item .r-sub{
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .chip{
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .chip-checked{
    background: rgba(31,138,95,0.1);
    color: var(--success);
  }
  .chip-unchecked{
    background: rgba(118,112,101,0.12);
    color: var(--text-dim);
  }
  .empty-note{
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 16px 0;
  }
</style>
</head>
<body>

  <div class="card">

    <!-- ログイン画面 -->
    <div id="login-area">
      <div class="brand" style="margin-bottom:18px;"><span class="dot"></span>SECURE CHECK-IN</div>
      <h1>QRコード情報照会</h1>
      <p class="subtitle">組織アカウントでログインし、QRコードをスキャンしてください。</p>

      <!-- 接続先の表示。切り替えは管理シートでのみ行うので、ここは表示専用 -->
      <div id="target-line" class="target-line">接続先を確認中…</div>

      <!-- この端末にログインが残っているときだけ表示する。
           カメラと音の初期化はユーザー操作の中で行う必要があるため、
           自動では再開せず、必ず1タップを挟む -->
      <div id="resume-area" class="hidden">
        <div class="resume-card">
          <p class="resume-name" id="resume-name"></p>
          <p class="resume-note" id="resume-note"></p>
        </div>
        <button id="resume-btn" class="btn-primary" onclick="onResumeClick()">スキャンを再開</button>
        <button id="switch-btn" class="btn-secondary" onclick="onSwitchAccountClick()" type="button">別のIDでログイン</button>
      </div>

      <div id="credential-area">
        <div class="field">
          <label for="login-id">ID</label>
          <input id="login-id" type="text" placeholder="user ID" autocomplete="username" lang="en"
                 inputmode="email" pattern="[A-Za-z0-9]*" autocapitalize="off" autocorrect="off" spellcheck="false">
          <p class="field-hint">半角英数字で入力してください（日本語入力はオフにしてください）</p>
        </div>
        <div class="field">
          <label for="login-pw">パスワード</label>
          <input id="login-pw" type="password" placeholder="••••••••" autocomplete="current-password"
                 inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"
                 onkeydown="if(event.key==='Enter') onLoginClick()">
        </div>

        <button id="login-btn" class="btn-primary" onclick="onLoginClick()">ログインしてスキャン開始</button>
      </div>
      <div id="login-error" class="error-msg hidden"></div>
      <!-- 別の接続先の未送信が端末に残っている場合の注意。
           ログインの結果とは独立なので、別の枠に出す -->
      <div id="orphan-notice" class="error-msg hidden"></div>
    </div>


    <!-- スキャン画面：照会結果を最上部に固定表示、タイトル・ブランドは下部 -->
    <div id="scan-area" class="hidden">

      <!-- 認証が完了するまで、この上に重なってカメラ映像・結果を隠す -->
      <div id="auth-overlay" class="auth-overlay hidden">
        <span class="spinner-lg"></span>
        <p id="auth-overlay-message">認証しています…</p>
      </div>

      <div class="scan-frame">
        <!-- カメラ映像の上に重ねる。枠の外に置くと映像の下に隠れてしまう -->
        <button id="mute-toggle" class="mute-btn" onclick="toggleMute()" aria-label="音声のオン・オフを切り替え" type="button">🔊</button>
        <div id="reader"></div>
      </div>

      <div class="header-bottom">
        <h1>スキャン中</h1>
        <p class="subtitle">枠内にQRコードを収めてください。連続で読み取れます。</p>
        <!-- 2つを横並びにして下部の高さを抑える。スクロール量そのものを減らす狙い -->
        <div class="btn-row">
          <button class="btn-secondary" onclick="openSearchView()">名前で検索</button>
          <button class="btn-secondary" onclick="reloadRoster()">名簿を再取得</button>
        </div>
        <!-- シフト上がりの操作。他のボタンと同じ大きさにして見落とされないようにする -->
        <button id="finish-btn" class="btn-secondary btn-finish" onclick="onFinishClick()" type="button">受付を終了</button>
        <div class="brand">
          <span class="dot"></span>SECURE CHECK-IN
          <button id="pending-flush" class="pending-btn hidden" onclick="manualFlush()" type="button">未送信あり · 送信</button>
        </div>
      </div>

      <!-- 照会結果。画面下部に固定で出すので、スクロール位置に関係なく必ず見える。
           スキャン画面を隠すと一緒に消えるよう、この中に置いている -->
      <div id="sheet-scrim" class="sheet-scrim" onclick="confirmResult()"></div>
      <div id="result-sheet" class="result-sheet" role="dialog" aria-live="polite" aria-label="照会結果">
        <div class="sheet-handle"></div>
        <div id="loading" class="loading-row hidden">
          <span class="spinner"></span> 照会中...
        </div>
        <div id="info">
          <div class="result-label"><span class="pulse"></span>照会結果</div>
          <p class="res-name" id="res-name"></p>
          <p class="res-dept" id="res-dept"></p>
          <div id="lottery-banner" class="lottery-banner hidden">🎉 おめでとうございます 🎉</div>
          <p id="res-badge"></p>
          <button id="confirm-btn" class="btn-confirm hidden" onclick="confirmResult()" type="button">確認して次へ</button>
        </div>
      </div>
    </div>

    <!-- 名前検索画面 -->
    <div id="search-area" class="hidden">
      <h1>名前で検索</h1>
      <p class="subtitle">QRコードが読み取れない場合に使用します。</p>

      <input id="search-input" type="text" placeholder="名前を入力..." autocomplete="off">
      <p id="search-status">読み込み中...</p>

      <div id="search-results" class="result-list"></div>

      <button class="btn-secondary" onclick="closeSearchView()">スキャン画面に戻る</button>
    </div>

  </div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwdnQbHGQk0MNM1xNpZ2Qc4K8FRZI_UMMIyeZZFmaI7mJr2d45wo5kZSLDdEKemXC-I/exec'; // ← GASを新しくデプロイするたびに、ここを実際の/execURLに書き換える
  let authToken = null;
  let scannerInstance = null;
  let authFailed = false;
  let isLookupInProgress = false;
  let lastScannedId = null;
  let lastScanTime = 0;
  let rosterData = null; // 名簿。ログイン時に1回だけ取得し、照会も名前検索もこれで完結させる
  const SCAN_COOLDOWN_MS = 2500; // 同一QRコードの連続誤検出を防ぐための間隔

  // ローカル照合は一瞬で終わるため、そのまま結果を出すと読み取れたことが分からない。
  // 「照会中...」を意図的に少しだけ挟んで、スキャンが通ったことを伝える
  const RESULT_DELAY_MS = 500;
  let resultDisplayTimer = null;
  let lookupGeneration = 0;

  // 照会できたときは、確認ボタンを押すまで次のスキャンを受け付けない。
  // 結果を見落としたまま次の人に進んでしまうのを防ぐため
  let awaitingConfirm = false;

  // 名簿にないIDを読んだとき、当日追加された人の可能性があるため名簿を取り直す。
  // ただし無関係なQRコードを読むたびに取りに行かないよう、歯止めをかける
  // 前回の名簿取得から、この時間は取り直しをしない。
  //
  // 【SCAN_COOLDOWN_MS 以下にしておくこと】
  // これより長いと「もう一度読み取ってください」と案内しても、
  // スキャナが読み直しを許す時点では取り直しが弾かれたままになり、
  // 案内が成立しない。値を直接書かずに参照しているのはそのため。
  //
  // 現実的な取り直し回数は、この値をいくら伸ばしても大きく変わらない。
  // 同じIDの繰り返しは refetchedForIds が止めていて、
  // 当日追加の人は固まって来るので1回の取り直しがまとめて解決する
  // （10人が同時に登録 → 1人目の取り直しで全員が名簿に入る）。
  // 取り直し中は isLookupInProgress で次の読み取りも止まる。
  // つまりこの値が抑えているのは「異なる未知QRを連続で読む」場合だけで、
  // 受付の現場では起きない
  const ROSTER_REFETCH_COOLDOWN_MS = SCAN_COOLDOWN_MS;
  let lastRosterFetchAt = 0;
  const refetchedForIds = {}; // 一度取り直して見つからなかったIDは、二度と取りに行かない

  /* ---- 取り直しを待つ上限 ----
     取り直しの間、レーンは止まる（isLookupInProgress で次の読み取りを弾くため）。
     混雑時はここが受付で一番長く止まる場所になるので、
     「取り直しにかかる時間」と「待つ時間」を切り離してある。

     待ちきれなかったときは、取得を裏で続けたまま結果を先に出す。
     取得が後から届けば名簿は新しくなっているので、
     案内どおりもう一度読み取れば見つかる。

     REFETCH_TIMEOUT_MS を既定より短く、再試行を0回にしているのは、
     待っている人が居ない取得を長く抱え込まないため。
     自動で再試行する代わりに、スタッフの読み直しが再試行になる。
     人の操作のほうが間隔が空くので、混雑への追い打ちにもなりにくい */
  // 待ちを切り上げる時点。
  //
  // 【取り直しの所要より長くすること。ここが短いと読み直しが増える】
  // 取り直しは正常時 1秒前後だが、混雑すると3秒近くまで伸びる。
  // 以前ここは SCAN_COOLDOWN_MS（2.5秒）だったが、それでは
  // 「あと0.2秒で着地するのに切り上げる」場合が出て、
  // 取り直しは成功していたのにスタッフが読み直す羽目になっていた。
  //
  // 試算では、3割が2.8秒かかる状況で無駄な読み直しが9回。
  // 混雑が倍（6割）なら18回。4秒にすると、いずれも0回になる。
  // 待ち時間が伸びるので総遅延が増えそうに見えるが、逆に減る
  // （切り上げ2.5秒＋読み直し4秒より、待ち切るほうが安い）。
  //
  // 【SCAN_COOLDOWN_MS より短くしないこと】
  // 切り上げると「もう一度読み取ってください」と案内するが、
  // 同じQRの連続検出は lastScanTime から SCAN_COOLDOWN_MS の間
  // 弾かれる（startScanner の中）。これより短いと、案内した直後の
  // 読み直しが無反応になり、案内が空振りする。
  //
  // 上限は REFETCH_TIMEOUT_MS。それを超えても意味がない
  // （取得そのものが打ち切られているので、待っても着地しない）
  const REFETCH_WAIT_MS = 4000;
  const REFETCH_TIMEOUT_MS = 8000; // 裏で走る取り直しの上限
  let rosterFetchInFlight = false; // 取り直しが走っている間は、重ねて走らせない

  /* ---- 通信処理（タイムアウトと自動再試行） ---- */
  const FETCH_MAX_RETRIES = 2;     // 初回を含めて最大3回試行する
  const FETCH_RETRY_WAIT_MS = 700; // 再試行までの待ち時間（回数に応じて伸ばす）
  const FETCH_TIMEOUT_MS = 10000;  // 1回あたりの上限。通常の照会は1秒前後なので十分な余裕がある

  /**
   * GASへのPOST通信。
   * 指定時間を過ぎても応答がなければ打ち切り、間隔をあけて自動的に再送する。
   * サーバーが正常に応答していれば（内容がエラーでも）再送はしない。
   *
   * onRetry:   再試行に入ったときに呼ばれる。画面表示の更新に使う。
   * maxRetries: 省略時は FETCH_MAX_RETRIES。0 にすると再試行しない。
   * timeoutMs:  省略時は FETCH_TIMEOUT_MS。経路ごとに変えるためのもの。
   *
   * 【最悪の所要時間】
   *   (再試行回数 + 1) × timeoutMs + 待ち時間の合計
   * 既定値では 10.0秒(再試行0) / 20.7秒(1回) / 32.1秒(2回)。
   * 受付のレーンが止まる経路では、ここを短くするか再試行を切ること
   */
  async function postToGas(payload, onRetry, maxRetries, timeoutMs) {
    const retryLimit = (typeof maxRetries === 'number') ? maxRetries : FETCH_MAX_RETRIES;
    const limitMs = (typeof timeoutMs === 'number') ? timeoutMs : FETCH_TIMEOUT_MS;
    let lastError = null;

    for (let attempt = 0; attempt <= retryLimit; attempt++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), limitMs);

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timer);
        return await res.json();

      } catch (err) {
        clearTimeout(timer);
        lastError = err;
        // AbortErrorはタイムアウトによる打ち切りを意味する
        const reason = (err.name === 'AbortError') ? 'タイムアウト' : err.message;
        console.error('[通信失敗 ' + (attempt + 1) + '回目]', err.name, reason);

        if (attempt < retryLimit) {
          if (onRetry) onRetry(attempt + 1);

          // 少し待ってから再試行する（瞬間的な不調を吸収するため）。
          //
          // 【待ち時間をばらつかせている理由】
          // 受付には4台が同時に入る。混雑でまとめて失敗すると、
          // 待ち時間が固定だと4台が同じ瞬間に再試行することになり、
          // 自分たちで混雑を作り直してしまう（再試行のたびに山が揃う）。
          // 0.5〜1.5倍の幅を持たせて、山を崩して返す。
          //
          // 平均は変わらないので、1台だけで使っているときの体感は同じ。
          // 最長は1.5倍までなので、最悪時間の見積りもほぼ変わらない
          const base = FETCH_RETRY_WAIT_MS * (attempt + 1);
          await new Promise(r => setTimeout(r, Math.round(base * (0.5 + Math.random()))));
        }
      }
    }

    throw lastError;
  }

  /* ==========================================================
   * チェックインの送信キュー
   * ==========================================================
   * 照会そのものは端末内の名簿で完結させ、
   * 「誰をチェックインしたか」だけをここに溜めて、
   * 一定件数または一定時間ごとにまとめて送信する。
   * これによりサーバーへのリクエスト数を大幅に減らしている。
   * ========================================================== */
  const QUEUE_FLUSH_SIZE = 10;            // この件数に達したら送信する
  const QUEUE_FLUSH_INTERVAL_MS = 120000; // 溜まったままでも、この間隔で必ず送信する（2分）
  let pendingCheckIns = [];   // 未送信のID
  let isFlushingQueue = false;
  let flushTimer = null;

  function loadPendingFromStorage() {
    const key = queueKey();
    if (!key) return;
    try {
      const saved = localStorage.getItem(key);
      if (!saved) return;

      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed)) return;

      // 今キューにある分を上書きしないよう、重複を避けて結合する
      parsed.forEach(function (id) {
        if (pendingCheckIns.indexOf(id) === -1) pendingCheckIns.push(id);
      });
    } catch (e) {
      // 壊れた内容が残っていても動作は継続させる
    }
  }

  /**
   * キューを保存する。
   * keyOverride は送信中に接続先が切り替わった場合のためにある。
   * 送信を始めた時点のキーに戻さないと、別のイベントのキューに混ざる
   */
  function savePendingToStorage(keyOverride) {
    const key = keyOverride || queueKey();
    if (!key) return;
    try {
      if (pendingCheckIns.length) {
        localStorage.setItem(key, JSON.stringify(pendingCheckIns));
      } else {
        localStorage.removeItem(key);
      }
    } catch (e) {
      // 保存できなくても動作自体は継続させる
    }
  }

  const PENDING_BTN_LABEL = '未送信あり · 送信';

  function updatePendingIndicator() {
    const el = document.getElementById('pending-flush');
    if (!el) return;

    el.classList.toggle('hidden', pendingCheckIns.length === 0);

    // 送信中は「送信中...」などの表示を出しているので、ここでは上書きしない
    if (!isFlushingQueue) {
      el.disabled = false;
      el.textContent = PENDING_BTN_LABEL;
    }
  }

  /**
   * 未送信分をその場で送る。
   * 自動送信を待たずに片付けたいときのための手動操作。
   */
  async function manualFlush() {
    const el = document.getElementById('pending-flush');
    if (!el || isFlushingQueue || !pendingCheckIns.length) return;

    el.disabled = true;
    el.textContent = '送信中...';

    const before = pendingCheckIns.length;
    await flushCheckInQueue();

    if (pendingCheckIns.length >= before) {
      // 送れずにキューへ戻った
      el.textContent = '送信できません';
      setTimeout(updatePendingIndicator, 1800);
    } else {
      updatePendingIndicator();
    }
  }

  /* ==========================================================
   * 受付の終了
   * ==========================================================
   * シフト上がりの操作をここに集約する。
   *
   * 未送信のキューは pagehide の sendBeacon と localStorage で
   * 二重に保護してあるが、復元が走るのは「次にこの端末で再開したとき」
   * なので、そのまま端末を置いて帰られると記録が取り残される。
   * ここを押してもらえば、その場で確実に送り切れる。
   *
   * 「未送信を送信してください」と促すより、
   * 「上がるときは受付を終了」の方が行動として分かりやすいため、
   * こちらを正規の手順にする。
   *
   * 【保存してあるログインは消さない】
   * このボタンの目的はキューを送り切ることで、資格情報の破棄ではない。
   * 消してしまうと、押すたびにID入力とパスワード貼り付けが必要になり、
   * 「押すと面倒だから押さない」という圧力がかかる。
   * それはこのボタンの存在目的そのものを損なう。
   *
   * そのため名前も「ログアウト」にしていない。
   * 資格情報を消したいときは、戻った画面の「別のIDでログイン」を使う。
   * あちらが唯一、端末から保存を消す操作になっている
   * ========================================================== */
  async function onFinishClick() {
    const btn = document.getElementById('finish-btn');
    if (!btn || btn.disabled) return;

    // 未送信があれば、先に送り切ってから終了する
    if (pendingCheckIns.length) {
      btn.disabled = true;
      btn.textContent = '送信中...';
      await flushCheckInQueue();
      btn.disabled = false;
      btn.textContent = '受付を終了';
    }

    // 送れなくても終了は止めない。
    //
    // 確認ダイアログで引き止めても、待っている間に通信が戻る保証はなく、
    // 「キャンセル」を選んでも送信できる状態にはならない。
    // 判断を求めるだけスタッフへの説明が増えるので、
    // 代わりに「次に何をすればよいか」をメッセージで伝える
    const left = pendingCheckIns.length;
    document.getElementById('login-pw').value = '';

    // stopScannerAndReturnToLogin() の中でも flushCheckInQueue() が呼ばれる。
    // トークンを先に捨てると、その最後の試行が必ず認証エラーになって無駄になるため、
    // 画面を戻してから破棄する。
    // flushCheckInQueue() は最初のawaitに入る前に token を読み終えているので、
    // 直後に null にしても送信中のリクエストには影響しない。
    //
    // localStorage側の保存は残すので、戻った画面は「スキャンを再開」になる。
    // 未送信が残っていても、パスワードを探さずに1タップで復旧できる
    stopScannerAndReturnToLogin(
      left ? '受付を終了しました（未送信 ' + left + '件）。通信が回復したら、' +
             '「スキャンを再開」を押すと送信されます'
           : '受付を終了しました。記録はすべて送信済みです',
      0,
      left === 0 // 未送信が残っていれば注意として赤、無ければ完了として緑で出す
    );

    authToken = null;
  }

  function enqueueCheckIn(id) {
    pendingCheckIns.push(String(id));
    savePendingToStorage();
    updatePendingIndicator();

    if (pendingCheckIns.length >= QUEUE_FLUSH_SIZE) {
      flushCheckInQueue();
    }
  }

  /* ==========================================================
   * 接続先が切り替わったとき
   * ==========================================================
   * サーバーが targetChanged を返したら、このセッションはもう使えない。
   *
   * 順番が重要。先に clearSession() を呼んで「古い接続先の」保存を消し、
   * そのあとで activeTargetKey を新しい値に入れ替える。
   * 逆にすると、新しい接続先のキーを消して古い保存が残る
   * ========================================================== */
  let targetChangedNotice = null;

  function handleTargetChanged(data) {
    clearSession();
    authToken = null;
    applyTargetInfo(data);
    targetChangedNotice = '接続先が「' + (data.targetName || '') + '」に切り替わりました。' +
                          'パスワードは同じものが使えます。';
  }

  /**
   * 溜まったチェックインをまとめて送信する。
   * 送信に失敗した場合はキューに戻し、次の機会に再送する。
   */
  async function flushCheckInQueue() {
    if (isFlushingQueue || !pendingCheckIns.length || !authToken) return;

    isFlushingQueue = true;
    // 送信中に新たなスキャンがあってもよいよう、対象を切り出しておく
    const sending = pendingCheckIns.slice();
    // 送信中に接続先が切り替わっても、戻す先を間違えないよう控えておく
    const keyAtStart = queueKey();
    pendingCheckIns = [];
    savePendingToStorage(keyAtStart);
    updatePendingIndicator();

    let switchData = null;

    try {
      const data = await postToGas({ action: 'bulkCheckIn', token: authToken, ids: sending });

      if (!data.success) {
        // サーバー側で拒否された場合も、記録を失わないようキューに戻す
        pendingCheckIns = sending.concat(pendingCheckIns);
        console.error('[チェックイン記録失敗]', data.message);

        if (data.targetChanged) {
          // この分は切り替え前の接続先のもの。新しい接続先には持ち込まない
          switchData = data;
        } else if (String(data.message || '').indexOf('認証エラー') === 0) {
          // トークンが通らなくなっていたら保存を捨てる。
          // 残したままだと、起動のたびに通らないトークンで再開を試みてしまう
          clearSession();
        }
      }
    } catch (err) {
      pendingCheckIns = sending.concat(pendingCheckIns);
      console.error('[チェックイン送信失敗]', err.name, err.message);
    } finally {
      // 必ず送信開始時のキーへ戻す
      savePendingToStorage(keyAtStart);

      if (switchData) {
        // 元の接続先のキーに保存した上で、メモリからは落とす。
        // 残しておくと、次の送信で新しい接続先へ流れてしまう
        pendingCheckIns = [];
        handleTargetChanged(switchData);
      }

      updatePendingIndicator();
      isFlushingQueue = false;
    }
  }

  function startQueueTimer() {
    if (flushTimer) clearInterval(flushTimer);
    flushTimer = setInterval(flushCheckInQueue, QUEUE_FLUSH_INTERVAL_MS);
  }

  // 画面を閉じる・別アプリに切り替える直前に、溜まっている分を送っておく
  window.addEventListener('pagehide', function () {
    if (pendingCheckIns.length && authToken && navigator.sendBeacon) {
      try {
        navigator.sendBeacon(
          GAS_URL,
          new Blob(
            [JSON.stringify({ action: 'bulkCheckIn', token: authToken, ids: pendingCheckIns })],
            { type: 'text/plain' }
          )
        );
        // 送信できたと確定はできないため、キューはあえて消さない。
        // 重複して届いても、サーバー側は同じ行をTRUEにするだけなので害はない。
      } catch (e) {
        // 送信できなくても、localStorageに残っているので次回起動時に再送される
      }
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) flushCheckInQueue();
  });

  /**
   * 通信が回復したら、その場で溜まっている分を送る。
   *
   * これが無いと、回復してから最大2分（QUEUE_FLUSH_INTERVAL_MS）
   * 送信されないままになる。その間に端末を閉じられると、
   * 送信は次の起動まで持ち越しになる。
   *
   * navigator.onLine は「つながっていない」ことしか正確に言えない
   * （Wi-Fiに繋がっていて外に出られない状態でも true になる）。
   * ここでは回復の合図としてだけ使っていて、判定には使っていないので
   * その不正確さは問題にならない。
   *
   * 送る中身が無いとき・未ログインのときは flushCheckInQueue() が
   * 先頭で何もせずに返るので、ここでの判定は不要
   */
  window.addEventListener('online', function () {
    flushCheckInQueue();
  });

  // ---- 通知音（Web Audio APIでその場で合成。外部音源ファイルは一切使用しない） ----
  let audioCtx = null;
  let audioOutput = null; // 出力段のリミッター。getAudioOutput() が必要になった時点で作る
  /**
   * sessionStorage は、プライベートブラウズやサイトデータの制限、
   * 組織のポリシーなどでアクセスそのものが例外になることがある。
   * 保護せずに読むとそこでスクリプト全体が停止し、画面が動かなくなるため、
   * 必ずこの3つを通して読み書きする（localStorageの読み書きは既に保護済み）
   */
  function safeSessionGet(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSessionSet(key, value) {
    try { sessionStorage.setItem(key, value); } catch (e) { /* 保存できなくても動作は継続させる */ }
  }
  function safeSessionRemove(key) {
    try { sessionStorage.removeItem(key); } catch (e) { /* 同上 */ }
  }

  /* ==========================================================
   * ログインの保持（再読み込みでもログイン状態を残す）
   * ==========================================================
   * トークンは「IDと期限」だけを署名したもので、端末を識別する要素を
   * 持っていない。つまりこの文字列を持っている者がそのIDとして扱われる。
   * 端末の外に出る経路が無いので、保存場所がそのまま有効範囲になる。
   *
   *   保存しない   → そのタブ、再読み込みまで（以前の挙動）
   *   localStorage → その端末のそのブラウザ、期限まで
   *
   * 正確な境界は「端末」ではなく「ブラウザのプロファイル」。
   * 同じ端末のSafariとChromeは別扱いで、プライベートブラウズでは
   * 保存されない。保存できない環境では以前の挙動に戻るだけで壊れない。
   *
   * 【期限の判定はサーバーが正】
   * ここで持っている savedAt は、明らかに切れたトークンを無駄に
   * 投げないための目安にすぎない。端末の時計がずれていても、
   * サーバーが認証エラーを返し、その時点で保存を捨ててログイン画面に戻る。
   *
   * 【失効手段】
   * emergencyReset() が TOKEN_SECRET を入れ替えると、保存済みトークンは
   * すべて署名が合わなくなる。端末側に残っていても通らない。
   *
   * 【IDは秘密ではないので別に保存する】
   * 入力欄に戻しておくと、再ログイン時の入力がパスワードだけになる。
   * セッションが切れても消さない
   * ========================================================== */
  const LAST_ID_KEY = 'qr_last_login_id';
  // Code_scanner の TOKEN_LIFETIME_MS と揃える
  const SESSION_MAX_AGE_MS = 12 * 60 * 60 * 1000;

  /* ==========================================================
   * 接続先（どのイベントの名簿を見るか）
   * ==========================================================
   * 決めるのはサーバー（管理シートの「接続先」シートのB1）で、
   * 端末側は指定できない。ここにあるのは表示と、
   * localStorageのキーを接続先ごとに分けるための値だけ。
   *
   * 【キーを接続先ごとに分ける理由】
   * localStorageはオリジン単位で、パスでは分かれない。
   * キーを固定にすると、11/14で溜めた未送信のキューが
   * 11/15のセッションで復元されて、11/15の名簿に書き込まれてしまう。
   * トークンに接続先を埋めて守っているものが、ここから裏返る
   * ========================================================== */
  let activeTargetKey = null;
  let activeTargetName = null;

  // 接続先が分かるまでは null を返す。その間は保存を読み書きしない
  function sessionKey() {
    return activeTargetKey ? ('qr_' + activeTargetKey + '_auth_session') : null;
  }
  function queueKey() {
    return activeTargetKey ? ('qr_' + activeTargetKey + '_pending_checkins') : null;
  }

  function applyTargetInfo(data) {
    activeTargetKey = data.targetKey || null;
    activeTargetName = data.targetName || null;
    // サーバーは dateMatches も返すが、この画面では意図的に使わない。
    // スタッフは接続先を変更できないので、日付の不一致を警告しても
    // 取れる行動がなく、混乱させるだけになる。
    // 切り替え忘れは、管理シートのD1・管理ツール・毎朝の通知で気づく
    renderTargetLine();
  }

  /**
   * 接続先の行を描く。
   * 名前は管理シートに人が書いた値なので、textContentで入れる
   */
  function renderTargetLine(overrideMessage) {
    const el = document.getElementById('target-line');
    el.textContent = '';

    if (overrideMessage) { el.textContent = overrideMessage; return; }
    if (!activeTargetName) { el.textContent = '接続先を確認中…'; return; }

    const name = document.createElement('span');
    name.className = 'target-name';
    name.textContent = activeTargetName;

    el.appendChild(document.createTextNode('接続先: '));
    el.appendChild(name);
  }

  /**
   * 接続先を取り、ログイン画面を描き直す。
   * 失敗しても入力欄からのログインはできる（接続先はサーバーが決めるため）
   */
  async function loadTargetInfo() {
    try {
      const data = await postToGas({ action: 'targetInfo' }, null, 1);
      if (data.success) {
        applyTargetInfo(data);
        refreshLoginView();   // 接続先が分かってから、保存の有無に応じて出し直す
        renderOrphanNotice();
        return;
      }
      renderTargetLine(data.message);
    } catch (err) {
      console.error('[接続先の取得失敗]', err.name, err.message);
      renderTargetLine('接続先を確認できませんでした。通信を確認してください');
    }
  }

  /**
   * 別の接続先の未送信が端末に残っていないか調べて知らせる。
   * 黙って消すと記録が失われ、黙って送ると別のイベントに書き込まれるので、
   * どちらもせず人に判断を渡す
   */
  function renderOrphanNotice() {
    const el = document.getElementById('orphan-notice');
    el.classList.add('hidden');
    if (!activeTargetKey) return;

    const found = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const m = key && key.match(/^qr_(.+)_pending_checkins$/);
        if (!m || m[1] === activeTargetKey) continue;
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(parsed) && parsed.length) {
          found.push({ target: m[1], count: parsed.length });
        }
      }
    } catch (e) {
      return; // 読めない環境では出さない
    }
    if (!found.length) return;

    const total = found.reduce(function (a, b) { return a + b.count; }, 0);
    el.textContent = 'この端末に、別の接続先の未送信が' + total + '件残っています（' +
      found.map(function (f) { return f.target; }).join('・') +
      '）。管理者に連絡してください。';
    el.classList.remove('hidden');
  }

  function saveSession(token, name) {
    const key = sessionKey();
    if (!key) return;
    try {
      localStorage.setItem(key, JSON.stringify({
        token: token,
        name: name || '',
        savedAt: Date.now()
      }));
    } catch (e) {
      // 保存できなくても動作は継続させる（毎回ログインになるだけ）
    }
  }

  function loadSession() {
    const key = sessionKey();
    if (!key) return null;
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;

      const saved = JSON.parse(raw);
      if (!saved || typeof saved.token !== 'string' || !saved.token) return null;
      if (typeof saved.savedAt !== 'number') return null;

      // 負になるのは端末の時計が巻き戻された場合。信用せず捨てる
      const age = Date.now() - saved.savedAt;
      if (age < 0 || age > SESSION_MAX_AGE_MS) return null;

      saved.remainingMs = SESSION_MAX_AGE_MS - age;
      return saved;
    } catch (e) {
      // 壊れた内容が残っていてもログイン画面から始められる
      return null;
    }
  }

  function clearSession() {
    const key = sessionKey();
    if (!key) return;
    try { localStorage.removeItem(key); } catch (e) { /* 同上 */ }
  }

  function saveLastLoginId(id) {
    try { localStorage.setItem(LAST_ID_KEY, id); } catch (e) { /* 同上 */ }
  }

  /**
   * ログイン画面を、端末の状態に合わせて出し分ける。
   * 起動時と、スキャン画面からログイン画面に戻るたびに呼ぶ。
   */
  function refreshLoginView() {
    // IDは秘密ではないので、セッションの有無にかかわらず戻しておく
    try {
      const lastId = localStorage.getItem(LAST_ID_KEY);
      const idEl = document.getElementById('login-id');
      if (lastId && idEl && !idEl.value) idEl.value = lastId;
    } catch (e) { /* 同上 */ }

    const saved = loadSession();
    const resumeArea = document.getElementById('resume-area');
    const credArea = document.getElementById('credential-area');

    if (!saved) {
      resumeArea.classList.add('hidden');
      credArea.classList.remove('hidden');
      return;
    }

    // 「約」なので分単位まで出す必要はない。1時間以上は時間だけにする。
    // 切り捨てにすると、ログインした直後に「約11時間」と出て不具合に見えるため、
    // 四捨五入している
    const hours = Math.round(saved.remainingMs / 3600000);
    const left = hours >= 1
      ? (hours + '時間')
      : (Math.max(1, Math.round(saved.remainingMs / 60000)) + '分');

    document.getElementById('resume-name').textContent = saved.name ? saved.name : 'ログイン済み';
    document.getElementById('resume-note').textContent =
      'この端末のログインが残っています（あと約' + left + '）。' +
      '交代するときは「別のIDでログイン」を押してください。';

    resumeArea.classList.remove('hidden');
    credArea.classList.add('hidden');
  }

  let isMuted = safeSessionGet('qr_scanner_muted') === 'true';

  function initAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
      audioOutput = null; // 新しいAudioContextには、その上で作り直したリミッターを使う
    }
  }

  /**
   * 音をひとつ鳴らす。
   *
   * envelope に 'sustain' を渡すと、指定した振幅を保ったまま鳴らしてから減衰する。
   * 'decay' は鳴り始めた直後から減衰する（音階のある抽選音はこちらが自然）。
   * 保持型は、ピーク振幅を変えずに実効値を上げられるため、音割れさせずに大きく聞こえる。
   *
   * endFrequency を渡すと、frequency からそこへ高さを滑らせる。
   * 下降は「失敗」、上昇は「完了」として受け取られやすい。
   */
  function playTone(frequency, duration, type, delay, volume, envelope, endFrequency) {
    if (isMuted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';

    const startTime = audioCtx.currentTime + (delay || 0);
    const v = volume || 0.15;

    if (endFrequency && endFrequency !== frequency) {
      osc.frequency.setValueAtTime(frequency, startTime);
      osc.frequency.exponentialRampToValueAtTime(endFrequency, startTime + duration);
    } else {
      osc.frequency.value = frequency;
    }

    if (envelope === 'sustain') {
      const attack = Math.min(0.005, duration * 0.2);
      const release = Math.min(0.03, duration * 0.4);
      const sustainEnd = startTime + Math.max(attack, duration - release);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.linearRampToValueAtTime(v, startTime + attack);
      gain.gain.setValueAtTime(v, sustainEnd);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    } else {
      gain.gain.setValueAtTime(v, startTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    }

    osc.connect(gain);
    gain.connect(getAudioOutput());
    osc.start(startTime);
    osc.stop(startTime + duration + 0.01);
  }

  /**
   * 出力段。抽選音は和音が重なるため、合計振幅が1.0を超えて音割れしないよう
   * リミッターを1つ挟んでおく（通常は働かず、万一の超過だけを抑える）
   */
  function getAudioOutput() {
    if (!audioOutput) {
      audioOutput = audioCtx.createDynamicsCompressor();
      audioOutput.threshold.value = -1;
      audioOutput.knee.value = 0;
      audioOutput.ratio.value = 20;
      audioOutput.attack.value = 0.003;
      audioOutput.release.value = 0.1;
      audioOutput.connect(audioCtx.destination);
    }
    return audioOutput;
  }

  /**
   * 上昇する2音。重ねずにsawtoothの倍音で厚みを出している。
   * 倍音は基音より上にしか乗らないので音程が下がらず、
   * 単音なので振幅の上限をまるごと使える
   */
  function playSuccessSound() {
    playTone(1500, 0.16, 'sawtooth', 0, 0.9, 'sustain');
    playTone(1900, 0.2, 'sawtooth', 0.17, 0.9, 'sustain');
  }

  /**
   * エラー音は廃止した。読み取り失敗は画面の表示と確認ボタンで伝える。
   * 成功音が大きくなったので、鳴らないこと自体がエラーの合図になる。
   * 呼び出し元はそのままにしておき、ここで何もしない形にしている
   */
  function playErrorSound() {
    // 意図的に何も鳴らさない
  }

  /**
   * 上昇アルペジオを長めに鳴らして和音として積み上げ、最後に保持型の和音で締める。
   *
   * 短い減衰だけで組むと実効値がピークの1/4程度しかなく、厚みを増した成功音に比べて
   * 20dB以上小さく聞こえてしまう。鳴らし続けて重ねることで、
   * 臨界帯域をまたいだラウドネスの加算が効くようにしている
   */
  function playLotterySound() {
    // ファンファーレ型。上がって（C5 G5 C6）下がって（A5 F5）また上がる（C6 E6 G6 C7）。
    // 音の出だしの間隔は0.105秒。sawtoothにしてあるのは認証音と系統を揃えるため
    playTone(523.25, 0.50, 'sawtooth', 0.00, 0.45, 'decay');  // C5
    playTone(783.99, 0.50, 'sawtooth', 0.11, 0.45, 'decay');  // G5
    playTone(1046.5, 0.50, 'sawtooth', 0.21, 0.45, 'decay');  // C6
    playTone(880.00, 0.50, 'sawtooth', 0.32, 0.45, 'decay');  // A5
    playTone(698.46, 0.50, 'sawtooth', 0.42, 0.45, 'decay');  // F5
    playTone(1046.5, 0.50, 'sawtooth', 0.53, 0.45, 'decay');  // C6
    playTone(1318.51, 0.50, 'sawtooth', 0.63, 0.45, 'decay'); // E6
    playTone(1567.98, 0.50, 'sawtooth', 0.74, 0.45, 'decay'); // G6
    playTone(2093.0, 0.50, 'sawtooth', 0.84, 0.45, 'decay');  // C7

    // 締めの和音（C6 E6 G6 C7）。保持型なので、長く鳴らしても音量の山は動かず余韻だけ伸びる。
    // 1音あたりを0.20にしているのは、4音が重なって合計の振幅が1.0を超えないようにするため。
    // 全体で約2.14秒。結果パネルの自動クローズ（4秒）には収まる
    playTone(1046.5, 1.20, 'sawtooth', 0.94, 0.20, 'sustain');  // C6
    playTone(1318.51, 1.20, 'sawtooth', 0.94, 0.20, 'sustain'); // E6
    playTone(1567.98, 1.20, 'sawtooth', 0.94, 0.20, 'sustain'); // G6
    playTone(2093.0, 1.20, 'sawtooth', 0.94, 0.20, 'sustain');  // C7
  }

  function toggleMute() {
    isMuted = !isMuted;
    safeSessionSet('qr_scanner_muted', String(isMuted));
    updateMuteButton();
  }

  function updateMuteButton() {
    const btn = document.getElementById('mute-toggle');
    if (!btn) return;
    btn.textContent = isMuted ? '🔇' : '🔊';
    btn.setAttribute('aria-label', isMuted ? 'ミュート中（クリックで解除）' : '音声オン（クリックでミュート）');
  }
  updateMuteButton(); // 初期表示に反映

  // IDフィールド:全角英数字を自動的に半角に変換し、それ以外の文字は除去
  // IME(日本語入力)の変換中に割り込むと候補選択が壊れるため、
  // 確定タイミング(compositionend)でのみサニタイズを行う
  const loginIdInput = document.getElementById('login-id');
  let isComposing = false;

  function sanitizeIdValue(el) {
    const before = el.value;
    const after = before
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
      .replace(/[^A-Za-z0-9]/g, '');
    if (before !== after) {
      el.value = after;
    }
  }

  loginIdInput.addEventListener('compositionstart', function () {
    isComposing = true; // IME入力中は何もしない(変換候補を壊さないため)
  });

  loginIdInput.addEventListener('compositionend', function (e) {
    isComposing = false;
    sanitizeIdValue(e.target); // 確定した瞬間にまとめて変換
  });

  loginIdInput.addEventListener('input', function (e) {
    if (isComposing) return; // IME変換中は素通りさせる
    sanitizeIdValue(e.target); // 直接入力・貼り付け等はこれまで通り即座に変換
  });

  loginIdInput.addEventListener('blur', function (e) {
    sanitizeIdValue(e.target); // 念のため、フォーカスが外れた時にも最終チェック
  });

  function onLoginClick() {
    // 待ち時間中はボタンを無効化してあるが、パスワード欄のEnterキーからも
    // 呼ばれるため、ここでも確認する
    if (retryUntil && Date.now() < retryUntil) return;

    const id = document.getElementById('login-id').value;
    const pw = document.getElementById('login-pw').value;

    if (!id || !pw) {
      showLoginError('IDとパスワードを入力してください');
      return;
    }

    // IME等の影響で全角文字や不正な文字が紛れ込んでいないか、最終確認する
    if (!/^[A-Za-z0-9]+$/.test(id)) {
      showLoginError('IDは半角英数字で入力してください（日本語入力がオンになっていないか確認してください）');
      return;
    }

    document.getElementById('login-error').classList.add('hidden');
    authFailed = false;

    // AudioContextはユーザー操作の中で生成する必要があるため、ここで初期化する
    initAudio();

    // カメラをこのクリック操作の中で同期的に起動する（awaitを挟まない）
    document.getElementById('login-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
    document.getElementById('auth-overlay').classList.remove('hidden'); // 認証完了まで隠す
    startScanner();

    // 認証は裏で並行して進める
    doLogin(id, pw);
  }

  async function doLogin(id, pw) {
    if (!GAS_URL || !GAS_URL.startsWith('https://script.google.com/')) {
      authFailed = true;
      stopScannerAndReturnToLogin('システム設定エラー: GAS_URLが正しく設定されていません(管理者に連絡してください)');
      return;
    }

    // 認証オーバーレイの文字。混雑すると最長32秒かかる経路なので、
    // 無反応に見せないよう再試行の経過をここに出す。
    // 画面が止まったと思われると、端末ごと再読み込みされてやり直しになる
    const msgEl = document.getElementById('auth-overlay-message');

    try {
      const data = await postToGas(
        { action: 'login', id: id, password: pw },
        function (retryCount) {
          msgEl.textContent = '接続が不安定です。認証を再試行中...(' + retryCount + ')';
        }
      );

      if (data.success) {
        authToken = data.token;
        // ログインの応答で接続先が確定する。saveSession より前に入れること
        // （保存のキーが接続先ごとに分かれているため）
        applyTargetInfo(data);
        // 再読み込みでもログインを維持する。詳しくは saveSession() の上のコメント
        saveSession(data.token, data.name);
        saveLastLoginId(id);

        if (data.isProvisional) {
          // 仮アカウントの本登録は、この画面から外してある。
          // スキャナに管理シートへの書き込み権限を持たせないためで、
          // 本登録は管理者が管理ツール側で行う
          authFailed = true;
          stopScannerAndReturnToLogin(
            'このアカウントは初期設定が済んでいません。管理者に連絡してください');
          return;
        }

        // 照会は端末内の名簿で行うため、名簿が揃うまでスキャン画面は見せない
        const ok = await loadRoster(function (text) { msgEl.textContent = text; });

        if (!ok) {
          authFailed = true;
          finishWithRosterFailure();
          return;
        }

        // 前回の端末終了時に送りきれなかった分があれば、ここで送る
        loadPendingFromStorage();
        updatePendingIndicator();
        startQueueTimer();
        flushCheckInQueue();

        msgEl.textContent = '認証しています…'; // 次回のために戻しておく
        document.getElementById('auth-overlay').classList.add('hidden'); // 名簿が揃った、カメラ画面を表示
      } else {
        authFailed = true;
        // 連続失敗時はサーバーが待ち秒数を返す。待ち時間はここで消費する
        stopScannerAndReturnToLogin(data.message, data.retryAfterSec);
      }
    } catch (err) {
      // 切り分け用：実際のエラー内容をコンソールに出す
      console.error('[ログイン通信失敗]', err.name, err.message, err);
      authFailed = true;
      stopScannerAndReturnToLogin('通信エラーが発生しました');
    }
  }

  /* ==========================================================
   * 端末に残ったログインから再開する
   * ==========================================================
   * カメラとAudioContextはユーザー操作の中で初期化しなければならないため、
   * 読み込んだだけで自動的にスキャン画面へ進むことはできない。
   * 1タップは必ず挟まるが、ID・パスワードの入力は省ける。
   *
   * 名簿は保存していない。氏名とメールアドレスを端末に置くことになるうえ、
   * 当日申し込みで古くなるため、再開のたびに取り直す
   * ========================================================== */
  function onResumeClick() {
    const saved = loadSession();
    if (!saved) {
      // ボタンを押すまでの間に期限が切れた、別のタブで保存が消された等
      refreshLoginView();
      showLoginError('ログインの保持期限が切れました。もう一度ログインしてください');
      return;
    }

    document.getElementById('login-error').classList.add('hidden');
    authToken = saved.token;
    authFailed = false;

    // AudioContextはユーザー操作の中で生成する必要があるため、ここで初期化する
    initAudio();

    // カメラをこのクリック操作の中で同期的に起動する（awaitを挟まない）
    document.getElementById('login-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
    document.getElementById('auth-overlay').classList.remove('hidden');
    startScanner();

    resumeSession();
  }

  async function resumeSession() {
    const msgEl = document.getElementById('auth-overlay-message');

    // 照会は端末内の名簿で行うため、名簿が揃うまでスキャン画面は見せない
    const ok = await loadRoster(function (text) { msgEl.textContent = text; });

    if (!ok) {
      authFailed = true;
      // 認証エラーだった場合、loadRoster() が既に保存を捨てている。
      // 通信エラーなら保存は生きているので、戻った画面でもう一度「再開」を押せる
      finishWithRosterFailure();
      return;
    }

    // 前回の端末終了時に送りきれなかった分があれば、ここで送る
    loadPendingFromStorage();
    updatePendingIndicator();
    startQueueTimer();
    flushCheckInQueue();

    msgEl.textContent = '認証しています…'; // 次回のために戻しておく
    document.getElementById('auth-overlay').classList.add('hidden');
  }

  /**
   * 交代する人が自分のIDで入り直すためのボタン。
   * 保存してあるログインと、入力欄に戻していたIDの両方を消す。
   */
  function onSwitchAccountClick() {
    clearSession();
    try { localStorage.removeItem(LAST_ID_KEY); } catch (e) { /* 消せなくても続行 */ }
    authToken = null;

    document.getElementById('login-error').classList.add('hidden');
    document.getElementById('resume-area').classList.add('hidden');
    document.getElementById('credential-area').classList.remove('hidden');

    // 前の人のIDが残っていると、そのまま押してしまう
    document.getElementById('login-id').value = '';
    document.getElementById('login-pw').value = '';
    document.getElementById('login-id').focus();
  }

  /**
   * 名簿が取れずにログイン画面へ戻すときの文面を決める。
   * 接続先の切り替えは異常ではないので、緑（完了）で出す
   */
  function finishWithRosterFailure() {
    if (targetChangedNotice) {
      const notice = targetChangedNotice;
      targetChangedNotice = null;
      stopScannerAndReturnToLogin(notice, 0, true);
      return;
    }
    stopScannerAndReturnToLogin('名簿を取得できませんでした。もう一度お試しください');
  }

  function stopScannerAndReturnToLogin(message, retryAfterSec, isInfo) {
    stopMirrorWatcher_();

    if (scannerInstance) {
      scannerInstance.clear().catch(() => {});
      scannerInstance = null;
    }

    // 表示待ちの結果が残っていれば取り消す
    if (resultDisplayTimer) {
      clearTimeout(resultDisplayTimer);
      resultDisplayTimer = null;
    }
    lookupGeneration++;
    isLookupInProgress = false;

    // 未送信の記録が残っていれば、画面を離れる前に送っておく
    flushCheckInQueue();
    if (flushTimer) {
      clearInterval(flushTimer);
      flushTimer = null;
    }

    rosterData = null; // セッションが変わるため名簿を破棄
    lastRosterFetchAt = 0;
    // 裏で走っている取り直しがあっても、ここで歯止めを戻す。
    // 戻さないと、入り直した直後の数秒だけ取り直しが効かなくなる。
    // 取り残した取得が後から rosterData を埋めることはあるが、
    // 入り直しの際に必ず取り直すので上書きされる
    rosterFetchInFlight = false;
    for (const k in refetchedForIds) delete refetchedForIds[k];

    awaitingConfirm = false;
    document.getElementById('confirm-btn').classList.add('hidden');
    document.getElementById('search-area').classList.add('hidden');
    document.getElementById('auth-overlay').classList.add('hidden'); // 次回のためにリセット
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('login-area').classList.remove('hidden');
    // セッションが残っていれば「再開」、消えていれば通常のログイン画面を出す。
    // 通信エラーで戻ってきた場合は保存が生きているので、入力し直さずに再開できる
    refreshLoginView();
    renderOrphanNotice(); // 切り替え直後は、前の接続先のキューが取り残される
    showLoginError(message, isInfo);
    startRetryCountdown(retryAfterSec); // 指定が無ければボタンを戻すだけ
  }

  function showLoginError(message, isInfo) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = message;
    errEl.classList.toggle('is-info', !!isInfo); // 受付の終了など、エラーでない場合
    errEl.classList.remove('hidden');
  }

  /* ==========================================================
   * 連続失敗後の待ち時間
   * ==========================================================
   * サーバー側ではsleepせず即座に返してもらい、待ち時間はここで消費する。
   * GASのUtilities.sleep()は実行スロットを解放しないため、サーバー側で
   * 待つと受付端末のスキャンまで通らなくなる（Code_scanner.gsのlogin参照）。
   *
   * 残り時間は「終了時刻」で保持する。カウンタを減らしていく方式だと、
   * 端末がバックグラウンドに回ったときにタイマーがスロットルされ、
   * 実際の経過時間とずれてしまう。
   *
   * 待ち時間の正はサーバー側にあるので、画面を再読み込みされても
   * 問題にならない（次の試行がサーバー側で安く弾かれる）
   * ========================================================== */
  const LOGIN_BTN_LABEL = 'ログインしてスキャン開始';
  let retryUntil = 0;
  let retryTimer = null;

  function startRetryCountdown(seconds) {
    if (retryTimer) {
      clearInterval(retryTimer);
      retryTimer = null;
    }

    const sec = Number(seconds);
    if (!sec || sec <= 0) {
      retryUntil = 0;
      resetLoginButton();
      return;
    }

    retryUntil = Date.now() + sec * 1000;
    renderRetryCountdown();
    retryTimer = setInterval(renderRetryCountdown, 250);
  }

  function renderRetryCountdown() {
    const btn = document.getElementById('login-btn');
    const remainMs = retryUntil - Date.now();

    if (remainMs <= 0) {
      retryUntil = 0;
      if (retryTimer) {
        clearInterval(retryTimer);
        retryTimer = null;
      }
      resetLoginButton();
      return;
    }

    const remainSec = Math.ceil(remainMs / 1000);
    btn.disabled = true;
    btn.textContent = remainSec >= 60
      ? 'あと ' + Math.ceil(remainSec / 60) + ' 分お待ちください'
      : 'あと ' + remainSec + ' 秒';
  }

  function resetLoginButton() {
    const btn = document.getElementById('login-btn');
    btn.disabled = false;
    btn.textContent = LOGIN_BTN_LABEL;
  }

  /* ==========================================================
   * インカメラのときだけ映像を左右反転する
   * ==========================================================
   * 前面カメラの映像はそのまま表示されるため、QRコードを右に動かすと
   * 画面では左に動く。狙いを合わせるのが難しい。
   * スマホの自撮り画面と同じように、映像だけを鏡像にして合わせやすくする。
   *
   * 【読み取りには影響しない】
   * CSSの transform は見た目だけを変える。html5-qrcode は video から
   * canvas へフレームをコピーして解析するが、drawImage が写すのは
   * 変換前の元フレームなので、デコーダは反転していない映像を見ている。
   * 鏡像になったQRコードは通常デコードできないため、ここは重要な点。
   *
   * 【カメラの切り替えに追従する】
   * html5-qrcode の標準UIにはカメラ選択があり、実行中に切り替えられる。
   * 切り替えると新しいストリームが流れ込むので、再生が始まるたびに
   * 見直している。videoごと作り直される場合に備えて、
   * MutationObserver でも拾っている
   * ========================================================== */
  let mirrorObserver = null;

  function isFrontFacingTrack_(track) {
    const settings = (track && track.getSettings) ? track.getSettings() : {};
    if (settings.facingMode === 'user') return true;
    if (settings.facingMode === 'environment') return false;

    // facingMode を返さない端末（主にPCの内蔵カメラ）向けの手がかり。
    // ラベルは機種と言語で変わるので、代表的な語だけ見る
    const label = String((track && track.label) || '').toLowerCase();
    if (/front|user|facetime|内側|前面|フロント/.test(label)) return true;
    if (/back|rear|environment|外側|背面|リア/.test(label)) return false;

    // 判定できないときは反転しない。既定は背面カメラなので、現状維持が安全
    return false;
  }

  function applyMirror_(video) {
    let front = false;
    try {
      const stream = video.srcObject;
      const track = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
      if (track) front = isFrontFacingTrack_(track);
    } catch (e) {
      // 取れなくても映像の表示は続ける
    }
    video.classList.toggle('is-mirrored', front);
  }

  function startMirrorWatcher_() {
    const container = document.getElementById('reader');
    if (!container || mirrorObserver) return;

    const hook = function (video) {
      if (video.dataset.mirrorHooked) return;
      video.dataset.mirrorHooked = '1';
      video.addEventListener('loadedmetadata', function () { applyMirror_(video); });
      video.addEventListener('playing', function () { applyMirror_(video); });
      applyMirror_(video);
    };

    const scan = function () {
      const video = container.querySelector('video');
      if (video) hook(video);
    };

    mirrorObserver = new MutationObserver(scan);
    mirrorObserver.observe(container, { childList: true, subtree: true });
    scan();
  }

  function stopMirrorWatcher_() {
    if (mirrorObserver) {
      mirrorObserver.disconnect();
      mirrorObserver = null;
    }
  }

  function startScanner() {
    scannerInstance = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: 230,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] // 画像ファイル読込は使用しない
      }
    );
    scannerInstance.render((decodedText) => {
      // 確認ボタン待ちの間は、次の人を読み取らない
      if (authFailed || isLookupInProgress || awaitingConfirm) return;

      const now = Date.now();
      // 同じQRコードを短時間に連続検出した場合は無視する（連続スキャンのための誤検出防止）
      if (decodedText === lastScannedId && (now - lastScanTime) < SCAN_COOLDOWN_MS) {
        return;
      }
      lastScannedId = decodedText;
      lastScanTime = now;

      lookupUser(decodedText);
      // pause/resumeは行わない：カメラを止めず、連続で次のQRコードを検出し続ける
    });

    startMirrorWatcher_();
  }

  /* ---- 名前検索画面 ---- */

  async function openSearchView() {
    closeSheet(); // 戻ってきたときに前の結果が開いたままにならないようにする
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('search-area').classList.remove('hidden');
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';
    document.getElementById('search-input').focus();

    const statusEl = document.getElementById('search-status');

    // 当日追加された人もその場で探せるよう、開いた時点で名簿を取り直す。
    // QRが読めなかったときにしか開かない画面なので、毎回取りに行っても負荷にならない
    const ok = await loadRoster(function (text) { statusEl.textContent = text; });

    if (ok) {
      // 最新の名簿に入れ替わったので、自動取り直しの履歴も白紙に戻す
      for (const k in refetchedForIds) delete refetchedForIds[k];
      // 取得を待つ間に入力されていた場合に備えて、結果を出し直す
      renderSearchResults(document.getElementById('search-input').value.trim());
    }
  }

  function closeSearchView() {
    document.getElementById('search-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
  }

  /**
   * 名簿を取得して端末内に保持する。
   * 照会も名前検索も、以降はこのデータだけで完結する。
   */
  async function loadRoster(onStatus, maxRetries, timeoutMs) {
    if (onStatus) onStatus('名簿を読み込み中...');

    // 取り直しの場合に備え、この端末で記録済みの分を控えておく。
    // サーバー側の状態で上書きして「照会済み」が巻き戻るのを防ぐため
    const checkedHere = {};
    if (rosterData) {
      rosterData.forEach(function (p) {
        if (p.checked) checkedHere[String(p.id)] = true;
      });
    }

    try {
      const data = await postToGas(
        { action: 'searchIndex', token: authToken },
        function (retryCount) {
          if (onStatus) onStatus('接続が不安定です。再試行中...(' + retryCount + ')');
        },
        maxRetries,
        timeoutMs
      );

      if (data.success) {
        rosterData = data.list;
        rosterData.forEach(function (p) {
          // 入力のたびに全件を変換すると無駄なので、正規化済みの名前を持たせておく
          p._searchKey = normalizeForSearch(p.name);
          if (checkedHere[String(p.id)]) p.checked = true;
        });
        lastRosterFetchAt = Date.now();
        if (onStatus) onStatus(rosterData.length + '件から検索できます');
        return true;
      }

      // 接続先が切り替わった場合。通常の認証エラーと文面を分ける
      if (data.targetChanged) {
        handleTargetChanged(data);
        if (onStatus) onStatus('接続先が切り替わりました');
        return false;
      }

      // 認証エラーなら、保存してあるトークンは既に通らない。
      // 通信エラー（catch側）と違い、持っていても無駄なので捨てる。
      // emergencyReset() による失効がここで効く
      if (String(data.message || '').indexOf('認証エラー') === 0) clearSession();

      if (onStatus) onStatus('読み込みに失敗しました: ' + data.message);
      return false;

    } catch (err) {
      console.error('[名簿の取得失敗]', err.name, err.message);
      if (onStatus) onStatus('名簿を取得できませんでした');
      return false;
    }
  }

  /**
   * 名簿を取り直す。
   * 受付中に申込が追加された場合に、再ログインせず反映させるためのもの。
   */
  async function reloadRoster() {
    const nameEl = document.getElementById('res-name');
    const deptEl = document.getElementById('res-dept');
    const badgeEl = document.getElementById('res-badge');

    document.getElementById('info').classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('lottery-banner').classList.add('hidden');
    document.getElementById('confirm-btn').classList.add('hidden');
    nameEl.classList.add('placeholder-row');
    nameEl.innerText = '名簿を再取得しています...';
    deptEl.innerText = '';
    badgeEl.innerHTML = '';
    openSheet();

    // 混雑すると最長32秒かかる。押した本人が見ているボタンなので、
    // 取得中・再試行中の経過をそのままパネルに出す。
    // loadRoster() が最後に出す「○○件から検索できます」は、
    // この直後の代入で必ず上書きされるため、画面には現れない
    const ok = await loadRoster(function (text) { nameEl.innerText = text; });

    if (ok) {
      // 手動で取り直したので、自動の取り直し履歴はいったん白紙に戻す
      for (const k in refetchedForIds) delete refetchedForIds[k];
      nameEl.innerText = '名簿を再取得しました（' + rosterData.length + '件）';
    } else {
      nameEl.classList.remove('placeholder-row');
      nameEl.innerHTML = '<span class="res-error">名簿を再取得できませんでした</span>';
    }

    // 確認を求める表示ではないので、読める時間だけ出して自動で閉じる
    autoCloseSheet(SHEET_AUTO_CLOSE_MS);
  }

  // 日本語入力の変換中は検索を走らせない（変換候補が確定する前に絞り込むと結果が安定しないため）
  let isSearchComposing = false;
  const searchInputEl = document.getElementById('search-input');

  searchInputEl.addEventListener('compositionstart', function () {
    isSearchComposing = true;
  });

  searchInputEl.addEventListener('compositionend', function (e) {
    isSearchComposing = false;
    renderSearchResults(e.target.value.trim());
  });

  searchInputEl.addEventListener('input', function () {
    if (isSearchComposing) return;
    renderSearchResults(this.value.trim());
  });

  /**
   * 検索用に文字列を正規化する。
   * ひらがな・カタカナの違いや、全角半角の揺れを吸収して
   * 「たなか」でも「タナカ」でもヒットするようにする。
   */
  function normalizeForSearch(str) {
    if (!str) return '';

    return String(str)
      .normalize('NFKC')          // 半角カタカナ・全角英数を標準形に揃える
      .replace(/[ぁ-ゖ]/g, function (c) {
        // ひらがなをカタカナに変換して比較する
        return String.fromCharCode(c.charCodeAt(0) + 0x60);
      })
      .replace(/\s+/g, '')        // 空白の有無による差をなくす
      .toLowerCase();
  }

  function renderSearchResults(keyword) {
    const listEl = document.getElementById('search-results');
    listEl.innerHTML = '';

    if (!keyword || !rosterData) return;

    const normalizedKeyword = normalizeForSearch(keyword);

    const matches = rosterData
      .filter(p => (p._searchKey || '').includes(normalizedKeyword))
      .slice(0, 20);

    if (matches.length === 0) {
      listEl.innerHTML = '<p class="empty-note">該当する候補がありません</p>';
      return;
    }

    matches.forEach(p => {
      const item = document.createElement('div');
      item.className = 'result-item';
      item.innerHTML =
        '<div>' +
          '<div class="r-name"></div>' +
          '<div class="r-sub"></div>' +
        '</div>' +
        '<span class="chip ' + (p.checked ? 'chip-checked' : 'chip-unchecked') + '">' +
          (p.checked ? '照会済み' : '未照会') +
        '</span>';
      // 名前・メールはtextContentで入れることでHTMLとして解釈されないようにする
      item.querySelector('.r-name').textContent = p.name;
      item.querySelector('.r-sub').textContent =
        p.count + '名 ・ ' + maskEmail(p.email) + (p.isLottery ? ' ・ 🎉抽選対象' : '');

      item.addEventListener('click', function () { checkInFromSearch(p); });
      listEl.appendChild(item);
    });
  }

  /**
   * 同姓同名の判別に必要な最小限だけを見せる。
   * 例: tanaka.taro@example.com → ta***@example.com
   */
  function maskEmail(email) {
    if (!email) return 'メール未登録';
    const parts = String(email).split('@');
    if (parts.length !== 2) return '***';
    return parts[0].slice(0, 2) + '***@' + parts[1];
  }

  function checkInFromSearch(person) {
    // スキャン画面に戻してから、QRスキャンと全く同じ処理・演出を通す
    closeSearchView();

    // checkedの更新はlookupUser側で行う。
    // ここで先に立ててしまうと、初回なのに「照会済み」と表示されてしまう
    lookupUser(person.id);
  }

  /**
   * 照会処理。
   * 通信はせず、ログイン時に取得した端末内の名簿だけで完結させる。
   * チェックインの記録は送信キューに積み、後でまとめて送る。
   *
   * 判定と記録は即座に行うが、結果の表示だけは少し遅らせている。
   * ローカル照合は一瞬で終わるため、そのまま表示すると
   * 「読み取れたのか分からない」状態になってしまうため。
   */
  function lookupUser(qrId) {
    // 表示待ちの結果があれば破棄し、この回の結果で上書きする
    const myGeneration = ++lookupGeneration;
    if (resultDisplayTimer) clearTimeout(resultDisplayTimer);

    // 新しい照会が始まるので、前回の確認待ちは解除する
    // (名前検索から選んだ場合など、スキャン以外の経路で来ることがある)
    awaitingConfirm = false;
    document.getElementById('confirm-btn').classList.add('hidden');

    // 「照会中...」を見せる
    isLookupInProgress = true;
    document.getElementById('info').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');
    openSheet();

    if (!rosterData) {
      scheduleResult(myGeneration, { ok: false, message: '名簿を読み込み中です。少し待ってから再度スキャンしてください' });
      return;
    }

    const person = findInRoster(qrId);
    if (person) {
      scheduleResult(myGeneration, commitCheckIn(person));
      return;
    }

    // 名簿にない。当日追加された人の可能性があるので、
    // 条件を満たす場合だけ名簿を取り直してもう一度照合する
    if (canRefetchFor(qrId)) {
      refetchThenLookup(myGeneration, qrId);
      return;
    }

    scheduleResult(myGeneration, { ok: false, message: notFoundMessage_(qrId) });
  }

  function findInRoster(qrId) {
    return rosterData.find(p => String(p.id) === String(qrId));
  }

  /**
   * 「対象者が見つかりません」に、次に取るべき行動を添える。
   *
   *   取り直し済み … 何度読んでも結果は変わらないので、名前検索へ誘導する。
   *                  名前検索を開くと名簿を取り直し、同時に refetchedForIds も
   *                  白紙に戻るので、案内がそのまま復旧操作にもなっている
   *   取り直し中   … 待ちきれずに先に結果を出した場合。取得は裏で続いている。
   *                  「見つかりません」と断定せず、待ちであることを伝える
   *   クールダウン中 … もう一度読めば取り直しが走る。
   *                    ROSTER_REFETCH_COOLDOWN_MS が SCAN_COOLDOWN_MS 以下
   *                    なので、この案内は必ず成立する
   */
  function notFoundMessage_(qrId) {
    if (refetchedForIds[String(qrId)]) return '対象者が見つかりません（名前で検索してください）';
    if (rosterFetchInFlight) return '名簿を確認中です（もう一度読み取ってください）';
    return '対象者が見つかりません（もう一度読み取ってください）';
  }

  /** 判定を確定し、チェックインを送信キューに積む */
  function commitCheckIn(person) {
    const alreadyChecked = person.checked === true;
    person.checked = true;
    enqueueCheckIn(person.id);
    return { ok: true, person: person, alreadyChecked: alreadyChecked };
  }

  /**
   * 名簿を取り直してよいか。
   * 無関係なQRコードを読むたびに取りに行かないよう、二重に歯止めをかける。
   */
  function canRefetchFor(qrId) {
    if (refetchedForIds[String(qrId)]) return false; // 一度取り直しても居なかったID
    // 既に走っている取り直しがあるなら、それを待てばよい。
    // 待ちきれずに結果を出した直後の読み直しがここに来るので、
    // この歯止めが無いと、同じ取得を何本も重ねて混雑を広げてしまう
    if (rosterFetchInFlight) return false;
    if (Date.now() - lastRosterFetchAt < ROSTER_REFETCH_COOLDOWN_MS) return false;
    return true;
  }

  /**
   * 名簿を取り直して、同じIDをもう一度照合する。
   *
   * 待つのは REFETCH_WAIT_MS までで、それを過ぎたら結果を先に出して
   * レーンを解放する。取得そのものは裏で続ける（止めても得がない）。
   *
   * 裏に回った取得が後から成功した場合、画面には何も出さない。
   * 既に「もう一度読み取ってください」と案内済みで、
   * 読み直せば新しい名簿で見つかるため。
   * 勝手に結果を出すと、スタッフが別の人のQRを構えている最中に
   * 前の人の結果が割り込むことになる
   */
  async function refetchThenLookup(myGeneration, qrId) {
    const loadingEl = document.getElementById('loading');
    loadingEl.innerHTML = '<span class="spinner"></span> 名簿を確認しています...';

    rosterFetchInFlight = true;
    const fetching = loadRoster(null, 0, REFETCH_TIMEOUT_MS)
      .then(function (ok) { rosterFetchInFlight = false; return ok; },
            function () { rosterFetchInFlight = false; return false; });

    // 取得の完了と、待ちの打ち切りを競争させる。
    // 打ち切り側が勝っても fetching は解決し続ける（捨てていない）
    const waited = await Promise.race([
      fetching.then(function (ok) { return { done: true, ok: ok }; }),
      new Promise(function (resolve) {
        setTimeout(function () { resolve({ done: false, ok: false }); }, REFETCH_WAIT_MS);
      })
    ]);

    loadingEl.innerHTML = '<span class="spinner"></span> 照会中...';

    if (myGeneration !== lookupGeneration) return; // 新しいスキャンに追い越された

    if (!waited.done) {
      // 待ちきれなかった。レーンを止め続けないよう、ここで結果を出す。
      // refetchedForIds には入れない（居ないと確認できていないため）
      showResult(myGeneration, { ok: false, message: notFoundMessage_(qrId) });
      return;
    }

    if (!waited.ok) {
      showResult(myGeneration, { ok: false, message: '対象者が見つかりません（名簿を確認できませんでした）' });
      return;
    }

    const person = findInRoster(qrId);
    if (person) {
      showResult(myGeneration, commitCheckIn(person));
    } else {
      refetchedForIds[String(qrId)] = true; // 取り直しても居なかったので、もう取りに行かない
      showResult(myGeneration, { ok: false, message: notFoundMessage_(qrId) });
    }
  }

  /** 少し置いてから結果を出す（読み取れたことを伝えるための間） */
  function scheduleResult(myGeneration, result) {
    resultDisplayTimer = setTimeout(function () {
      resultDisplayTimer = null;
      showResult(myGeneration, result);
    }, RESULT_DELAY_MS);
  }

  // ---- 結果パネルの開閉 ----
  // パネルはposition:fixedなので、スクロール位置に関係なく同じ場所に出る

  const SHEET_AUTO_CLOSE_MS = 4000; // エラー表示を自動で閉じるまでの時間
  let sheetCloseTimer = null;

  // 下部アドレスバーへの対策はCSSの --sheet-safe-gap で行う。
  // バーの高さに合わせてJSで動かす方法も試せるが、スクロールでバーが伸縮するたびに
  // パネルが上下するため、固定の余白で動かさないことを優先した

  function openSheet() {
    if (sheetCloseTimer) { clearTimeout(sheetCloseTimer); sheetCloseTimer = null; }
    document.getElementById('result-sheet').classList.add('open');
    document.getElementById('sheet-scrim').classList.add('open');
  }

  function closeSheet() {
    if (sheetCloseTimer) { clearTimeout(sheetCloseTimer); sheetCloseTimer = null; }
    document.getElementById('result-sheet').classList.remove('open');
    document.getElementById('sheet-scrim').classList.remove('open');
  }

  /** 操作を待たずに閉じる。エラーや通知のように、確認を強制しない表示で使う */
  function autoCloseSheet(ms) {
    if (sheetCloseTimer) clearTimeout(sheetCloseTimer);
    sheetCloseTimer = setTimeout(function () {
      sheetCloseTimer = null;
      closeSheet();
    }, ms);
  }

  function showResult(myGeneration, result) {
    if (myGeneration !== lookupGeneration) return; // 新しいスキャンに追い越された

    const nameEl = document.getElementById('res-name');
    const deptEl = document.getElementById('res-dept');
    const badgeEl = document.getElementById('res-badge');
    const lotteryBanner = document.getElementById('lottery-banner');

    const confirmBtn = document.getElementById('confirm-btn');

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('info').classList.remove('hidden');
    nameEl.classList.remove('placeholder-row');

    if (!result.ok) {
      nameEl.innerHTML = '<span class="res-error">' + result.message + '</span>';
      deptEl.innerText = '';
      badgeEl.innerHTML = '';
      lotteryBanner.classList.add('hidden');
      playErrorSound();
      isLookupInProgress = false;

      // エラーは確認を強制しない（従来どおり、そのまま次を読み取れる）。
      // ただしパネルが開いたままだとカメラを覆うので、時間で閉じる
      confirmBtn.innerText = '閉じる';
      confirmBtn.classList.remove('hidden');
      autoCloseSheet(SHEET_AUTO_CLOSE_MS);
      return;
    }

    const person = result.person;

    nameEl.innerText = person.name;
    deptEl.innerText = '人数: ' + person.count + '名';

    badgeEl.innerHTML = result.alreadyChecked
      ? '<span class="badge badge-warn">⚠ 照会済み（再スキャン）</span>'
      : '<span class="badge badge-ok">✓ 新規照会</span>';

    if (person.isLottery) {
      // 再生のたびにアニメーションが走るよう、一度リセットしてから付け直す
      lotteryBanner.classList.remove('hidden');
      lotteryBanner.style.animation = 'none';
      void lotteryBanner.offsetWidth; // 強制リフロー(アニメーション再トリガーのため)
      lotteryBanner.style.animation = '';
      playLotterySound();
    } else {
      lotteryBanner.classList.add('hidden');
      playSuccessSound();
    }

    // 照会できた場合は、確認ボタンを押すまで次のスキャンに進ませない
    awaitingConfirm = true;
    confirmBtn.innerText = '確認して次へ';
    confirmBtn.classList.remove('hidden');

    isLookupInProgress = false;
  }

  /**
   * 結果を確認したことを受けて、次のスキャンを受け付ける状態に戻す。
   */
  function confirmResult() {
    awaitingConfirm = false;
    document.getElementById('confirm-btn').classList.add('hidden');
    closeSheet();

    // 前の人の結果が残っていると紛らわしいので消しておく。
    // パネルが閉じるアニメーションの最中に消すと中身が切り替わって見えるので、
    // 閉じ終わってから消す
    setTimeout(function () {
      document.getElementById('res-name').innerText = '';
      document.getElementById('res-dept').innerText = '';
      document.getElementById('res-badge').innerHTML = '';
      document.getElementById('lottery-banner').classList.add('hidden');
    }, 260);

    // 直前に読んだQRがまだカメラに映っていても、すぐには再検出しないようにする
    lastScanTime = Date.now();
  }

  /* ==========================================================
   * 起動時の処理
   * ==========================================================
   * 先に入力欄を出してから、接続先を取りに行く。
   * 接続先が分かるまで保存の読み出しができない（キーが接続先ごとなので）が、
   * 待たせると「開いたのに何も出ない」時間ができるため、
   * まず入力欄を見せて、分かった時点で「スキャンを再開」に差し替える。
   *
   * このscriptはbodyの末尾にあるので、DOMは揃っている
   * ========================================================== */
  refreshLoginView();
  loadTargetInfo();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR入場券照会</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface-sunken: #FAF8F3;
    --border: #E2DDD1;
    --text: #1E2126;
    --text-dim: #767065;
    --accent: #1F3B57;
    --accent-soft: rgba(31,59,87,0.08);
    --success: #1F8A5F;
    --danger: #C0392B;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 40px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .brand .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
  }

  .card{
    position: relative;
    width:100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px 26px;
    box-shadow: 0 16px 40px -24px rgba(30,33,38,0.25);
  }

  .mute-btn{
    position: absolute;
    top: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-sunken);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .mute-btn:hover{ background: var(--accent-soft); }
  .mute-btn:active{ transform: scale(0.94); }

  /* ---- 認証完了までスキャン画面を隠すオーバーレイ ---- */
  .auth-overlay{
    position: absolute;
    inset: 0;
    background: var(--surface);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 20;
    color: var(--text-dim);
    font-size: 14px;
  }
  .spinner-lg{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .subtitle{
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
    line-height:1.5;
  }

  /* ---- ログインフォーム ---- */
  .field{ margin-bottom: 14px; margin-top: 20px; }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .field input{
    width:100%;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input::placeholder{ color: #B5AE9F; }
  .field input:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field-hint{
    margin: 6px 2px 0;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .btn-primary{
    width:100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn-primary:hover{ filter: brightness(1.15); }
  .btn-primary:active{ transform: scale(0.98); }

  .error-msg{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top: 14px;
    padding: 11px 13px;
    background: rgba(192,57,43,0.07);
    border: 1px solid rgba(192,57,43,0.25);
    border-radius: 9px;
    color: var(--danger);
    font-size: 13px;
    line-height:1.4;
  }
  .error-msg::before{
    content:"!";
    flex-shrink:0;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--danger);
    color: #FFFFFF;
    font-size: 11px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .hidden{ display:none !important; }

  /* ---- スキャン画面全体の枠 ---- */
  .scan-frame{
    position: relative;
    width:100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  #reader{
    width:100% !important;
    background: var(--surface) !important;
  }

  #reader__scan_region{
    aspect-ratio: 1 / 1 !important;
    overflow: hidden !important;
    position: relative !important;
    background: #10131A !important;
  }
  #reader__scan_region video{
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }
  #reader img{ display:none; }

  /* html5-qrcode標準の白い縁取りを、デザインのアクセント色に変更 */
  div#qr-shaded-region > div{
    background-color: var(--accent) !important;
  }

  #reader__dashboard{
    background: var(--surface) !important;
    padding: 14px 4px 4px !important;
    color: var(--text-dim) !important;
    font-family: 'Inter', sans-serif !important;
  }
  #html5-qrcode-button-camera-stop,
  #html5-qrcode-button-camera-start{
    background: var(--accent) !important;
    color: #FFFFFF !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 10px 18px !important;
    font-family: 'Space Grotesk', sans-serif !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    cursor: pointer !important;
  }

  /* ---- 照会結果（画面上部に固定表示） ---- */
  .result-box{
    padding: 18px 18px 16px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 22px;
    min-height: 88px;
  }
  .result-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .result-label .pulse{
    width:7px; height:7px; border-radius:50%;
    background: var(--success);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(0.7); }
  }

  .loading-row{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 0;
  }
  .spinner{
    width:15px; height:15px;
    border-radius:50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .res-name{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .res-name.placeholder-row{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-dim);
  }
  .res-dept{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }

  .lottery-banner{
    position: relative;
    margin-top: 16px;
    padding: 20px 16px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #FFFFFF;
    background: linear-gradient(120deg, #FF6B6B, #FFB347, #FFD93D, #6BCB77, #4D96FF, #FF6BCB, #FF6B6B);
    background-size: 400% 400%;
    box-shadow: 0 8px 24px -6px rgba(255, 140, 60, 0.55), 0 0 0 3px rgba(255,255,255,0.4) inset;
    overflow: hidden;
    animation:
      lotteryPop 0.6s cubic-bezier(.36,1.56,.64,1),
      lotteryShimmer 2.5s linear infinite,
      lotteryGlow 1.1s ease-in-out infinite;
  }
  .lottery-banner::before{
    content: "✨";
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    animation: sparkleSpin 1.6s linear infinite;
  }
  .lottery-banner::after{
    content: "✨";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    animation: sparkleSpin 1.6s linear infinite reverse;
  }
  @keyframes lotteryPop{
    0%{ transform: scale(0.6) rotate(-4deg); opacity: 0; }
    55%{ transform: scale(1.12) rotate(2deg); opacity: 1; }
    75%{ transform: scale(0.97) rotate(-1deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  @keyframes lotteryShimmer{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 400% 50%; }
  }
  @keyframes lotteryGlow{
    0%, 100%{ box-shadow: 0 8px 24px -6px rgba(255, 140, 60, 0.55), 0 0 0 3px rgba(255,255,255,0.4) inset; }
    50%{ box-shadow: 0 8px 34px -4px rgba(255, 140, 60, 0.85), 0 0 0 3px rgba(255,255,255,0.7) inset; }
  }
  @keyframes sparkleSpin{
    0%{ transform: translateY(-50%) rotate(0deg) scale(1); }
    50%{ transform: translateY(-50%) rotate(180deg) scale(1.3); }
    100%{ transform: translateY(-50%) rotate(360deg) scale(1); }
  }

  .res-error{
    color: var(--danger);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
  }

  .badge{
    display: inline-block;
    margin-top: 10px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
  }
  .badge-ok{
    background: rgba(31,138,95,0.1);
    color: var(--success);
    border: 1px solid rgba(31,138,95,0.3);
  }
  .badge-warn{
    background: rgba(232,179,57,0.12);
    color: #8A6512;
    border: 1px solid rgba(232,179,57,0.4);
  }

  /* ---- スキャン画面下部：タイトル・説明文・ブランド ---- */
  .header-bottom{
    margin-top: 22px;
    text-align: center;
  }
  .header-bottom .brand{
    justify-content: center;
    margin-top: 14px;
  }

  /* ---- 氏名検索画面 ---- */
  .btn-secondary{
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    background: var(--surface);
    color: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .btn-secondary:hover{ background: var(--accent-soft); }

  #search-input{
    width: 100%;
    margin-top: 18px;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-sunken);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  #search-input:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #search-status{
    font-size: 12px;
    color: var(--text-dim);
    margin: 8px 2px 14px;
  }

  .result-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .result-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .result-item:hover{
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .result-item .r-name{
    font-weight: 600;
    font-size: 15px;
  }
  .result-item .r-sub{
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .chip{
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .chip-checked{
    background: rgba(31,138,95,0.1);
    color: var(--success);
  }
  .chip-unchecked{
    background: rgba(118,112,101,0.12);
    color: var(--text-dim);
  }
  .empty-note{
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 16px 0;
  }
</style>
</head>
<body>

  <div class="card">

    <!-- ログイン画面 -->
    <div id="login-area">
      <div class="brand" style="margin-bottom:18px;"><span class="dot"></span>SECURE CHECK-IN</div>
      <h1>QR入場券照会</h1>
      <p class="subtitle">配布されたアカウントでログインし、QRコードをスキャンしてください。</p>

      <div class="field">
        <label for="login-id">ID</label>
        <input id="login-id" type="text" placeholder="employee ID" autocomplete="username" lang="en"
               inputmode="email" pattern="[A-Za-z0-9]*" autocapitalize="off" autocorrect="off" spellcheck="false">
        <p class="field-hint">半角英数字で入力してください（日本語入力はオフにしてください）</p>
      </div>
      <div class="field">
        <label for="login-pw">パスワード</label>
        <input id="login-pw" type="password" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') onLoginClick()">
      </div>

      <button class="btn-primary" onclick="onLoginClick()">ログインしてスキャン開始</button>
      <div id="login-error" class="error-msg hidden"></div>
    </div>

    <!-- スキャン画面：照会結果を最上部に固定表示、タイトル・ブランドは下部 -->
    <div id="scan-area" class="hidden">

      <!-- 認証が完了するまで、この上に重なってカメラ映像・結果を隠す -->
      <div id="auth-overlay" class="auth-overlay hidden">
        <span class="spinner-lg"></span>
        <p>認証しています…</p>
      </div>

      <button id="mute-toggle" class="mute-btn" onclick="toggleMute()" aria-label="音声のオン・オフを切り替え" type="button">🔊</button>

      <div id="result-box" class="result-box">
        <div id="loading" class="loading-row hidden">
          <span class="spinner"></span> 照会中...
        </div>
        <div id="info">
          <div class="result-label"><span class="pulse"></span>照会結果</div>
          <p class="res-name placeholder-row" id="res-name">QRコードをスキャンしてください</p>
          <p class="res-dept" id="res-dept"></p>
          <div id="lottery-banner" class="lottery-banner hidden">🎉 おめでとうございます 🎉</div>
          <p id="res-badge"></p>
        </div>
      </div>

      <div class="scan-frame">
        <div id="reader"></div>
      </div>

      <div class="header-bottom">
        <h1>スキャン中</h1>
        <p class="subtitle">枠内にQRコードを収めてください。連続で読み取れます。</p>
        <button class="btn-secondary" onclick="openSearchView()">氏名で検索して入場処理</button>
        <div class="brand"><span class="dot"></span>SECURE CHECK-IN</div>
      </div>
    </div>

    <!-- 氏名検索画面 -->
    <div id="search-area" class="hidden">
      <h1>名前で検索</h1>
      <p class="subtitle">QRコードが読み取れない場合に使用します。</p>

      <input id="search-input" type="text" placeholder="氏名を入力..." autocomplete="off">
      <p id="search-status">読み込み中...</p>

      <div id="search-results" class="result-list"></div>

      <button class="btn-secondary" onclick="closeSearchView()">スキャン画面に戻る</button>
    </div>

  </div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbw7wPLL-AJHJrlnXsg9MgaS3mG5CD3ZoWoIj-tMMr0afF3j8hl4PgwCc5oBuvpJJf09/exec'; // ← GASを新しくデプロイするたびに、ここを実際の/execURLに書き換える
  let authToken = null;
  let scannerInstance = null;
  let authFailed = false;
  let isLookupInProgress = false;
  let lastScannedId = null;
  let lastScanTime = 0;
  let searchIndexData = null; // 氏名検索用のインデックス(ログイン後に1回だけ取得)
  const SCAN_COOLDOWN_MS = 2500; // 同一QRコードの連続誤検出を防ぐための間隔

  // ---- 通知音（Web Audio APIでその場で合成。外部音源ファイルは一切使用しない） ----
  let audioCtx = null;
  let isMuted = sessionStorage.getItem('qr_scanner_muted') === 'true';

  function initAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
  }

  function playTone(frequency, duration, type, delay, volume) {
    if (isMuted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = frequency;

    const startTime = audioCtx.currentTime + (delay || 0);
    gain.gain.setValueAtTime(volume || 0.15, startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playSuccessSound() {
    // 明るく上昇する2音のチャイム
    playTone(880.0, 0.12, 'sine', 0, 0.16);
    playTone(1318.5, 0.16, 'sine', 0.09, 0.16);
  }

  function playErrorSound() {
    // 低めの2音のブザー
    playTone(220, 0.16, 'square', 0, 0.10);
    playTone(180, 0.22, 'square', 0.14, 0.10);
  }

  function playLotterySound() {
    // 抽選対象向けの、華やかな上昇アルペジオ＋きらめく高音の重ね鳴らし
    const notes = [523.3, 659.3, 783.9, 987.8, 1318.5, 1567.98]; // C5,E5,G5,B5,E6,G6
    notes.forEach((freq, i) => {
      playTone(freq, 0.22, 'triangle', i * 0.07, 0.22);
    });
    // 最後にきらめく和音を重ねる
    playTone(1568.0, 0.35, 'sine', 0.42, 0.14);
    playTone(2093.0, 0.35, 'sine', 0.46, 0.12);
    playTone(2637.0, 0.4, 'sine', 0.5, 0.10);
  }

  function toggleMute() {
    isMuted = !isMuted;
    sessionStorage.setItem('qr_scanner_muted', String(isMuted));
    updateMuteButton();
  }

  function updateMuteButton() {
    const btn = document.getElementById('mute-toggle');
    if (!btn) return;
    btn.textContent = isMuted ? '🔇' : '🔊';
    btn.setAttribute('aria-label', isMuted ? 'ミュート中（クリックで解除）' : '音声オン（クリックでミュート）');
  }
  updateMuteButton(); // 初期表示に反映

  // IDフィールド:全角英数字を自動的に半角に変換し、それ以外の文字は除去
  // IME(日本語入力)の変換中に割り込むと候補選択が壊れるため、
  // 確定タイミング(compositionend)でのみサニタイズを行う
  const loginIdInput = document.getElementById('login-id');
  let isComposing = false;

  function sanitizeIdValue(el) {
    const before = el.value;
    const after = before
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
      .replace(/[^A-Za-z0-9]/g, '');
    if (before !== after) {
      el.value = after;
    }
  }

  loginIdInput.addEventListener('compositionstart', function () {
    isComposing = true; // IME入力中は何もしない(変換候補を壊さないため)
  });

  loginIdInput.addEventListener('compositionend', function (e) {
    isComposing = false;
    sanitizeIdValue(e.target); // 確定した瞬間にまとめて変換
  });

  loginIdInput.addEventListener('input', function (e) {
    if (isComposing) return; // IME変換中は素通りさせる
    sanitizeIdValue(e.target); // 直接入力・貼り付け等はこれまで通り即座に変換
  });

  loginIdInput.addEventListener('blur', function (e) {
    sanitizeIdValue(e.target); // 念のため、フォーカスが外れた時にも最終チェック
  });

  function onLoginClick() {
    const id = document.getElementById('login-id').value;
    const pw = document.getElementById('login-pw').value;

    if (!id || !pw) {
      showLoginError('IDとパスワードを入力してください');
      return;
    }

    // IME等の影響で全角文字や不正な文字が紛れ込んでいないか、最終確認する
    if (!/^[A-Za-z0-9]+$/.test(id)) {
      showLoginError('IDは半角英数字で入力してください（日本語入力がオンになっていないか確認してください）');
      return;
    }

    document.getElementById('login-error').classList.add('hidden');
    authFailed = false;

    // AudioContextはユーザー操作の中で生成する必要があるため、ここで初期化する
    initAudio();

    // カメラをこのクリック操作の中で同期的に起動する（awaitを挟まない）
    document.getElementById('login-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
    document.getElementById('auth-overlay').classList.remove('hidden'); // 認証完了まで隠す
    startScanner();

    // 認証は裏で並行して進める
    doLogin(id, pw);
  }

  async function doLogin(id, pw) {
    if (!GAS_URL || !GAS_URL.startsWith('https://script.google.com/')) {
      authFailed = true;
      stopScannerAndReturnToLogin('システム設定エラー: GAS_URLが正しく設定されていません(管理者に連絡してください)');
      return;
    }

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'login', id: id, password: pw })
      });
      const data = await res.json();

      if (data.success) {
        authToken = data.token;
        sessionStorage.setItem('auth_token', authToken);
        document.getElementById('auth-overlay').classList.add('hidden'); // 認証完了、カメラ画面を表示
      } else {
        authFailed = true;
        stopScannerAndReturnToLogin(data.message);
      }
    } catch (err) {
      authFailed = true;
      stopScannerAndReturnToLogin('通信エラーが発生しました');
    }
  }

  function stopScannerAndReturnToLogin(message) {
    if (scannerInstance) {
      scannerInstance.clear().catch(() => {});
      scannerInstance = null;
    }
    searchIndexData = null; // セッションが変わるため検索データを破棄
    document.getElementById('search-area').classList.add('hidden');
    document.getElementById('auth-overlay').classList.add('hidden'); // 次回のためにリセット
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('login-area').classList.remove('hidden');
    showLoginError(message);
  }

  function showLoginError(message) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = message;
    errEl.classList.remove('hidden');
  }

  function startScanner() {
    scannerInstance = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: 230,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] // 画像ファイル読込は使用しない
      }
    );
    scannerInstance.render((decodedText) => {
      if (authFailed || isLookupInProgress) return;

      const now = Date.now();
      // 同じQRコードを短時間に連続検出した場合は無視する（連続スキャンのための誤検出防止）
      if (decodedText === lastScannedId && (now - lastScanTime) < SCAN_COOLDOWN_MS) {
        return;
      }
      lastScannedId = decodedText;
      lastScanTime = now;

      lookupUser(decodedText);
      // pause/resumeは行わない：カメラを止めず、連続で次のQRコードを検出し続ける
    });
  }

  /* ---- 氏名検索画面 ---- */

  function openSearchView() {
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('search-area').classList.remove('hidden');
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';

    // 初回だけインデックスを取得し、以降は再利用する
    if (searchIndexData === null) {
      loadSearchIndex();
    } else {
      document.getElementById('search-status').textContent = searchIndexData.length + '件から検索できます';
    }
    document.getElementById('search-input').focus();
  }

  function closeSearchView() {
    document.getElementById('search-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
  }

  async function loadSearchIndex() {
    const statusEl = document.getElementById('search-status');
    statusEl.textContent = '読み込み中...';

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'searchIndex', token: authToken })
      });
      const data = await res.json();

      if (data.success) {
        searchIndexData = data.list;
        statusEl.textContent = searchIndexData.length + '件から検索できます';
      } else {
        statusEl.textContent = '読み込みに失敗しました: ' + data.message;
      }
    } catch (err) {
      statusEl.textContent = '通信エラーが発生しました';
    }
  }

  document.getElementById('search-input').addEventListener('input', function () {
    renderSearchResults(this.value.trim());
  });

  function renderSearchResults(keyword) {
    const listEl = document.getElementById('search-results');
    listEl.innerHTML = '';

    if (!keyword || !searchIndexData) return;

    const matches = searchIndexData
      .filter(p => String(p.name).includes(keyword))
      .slice(0, 20);

    if (matches.length === 0) {
      listEl.innerHTML = '<p class="empty-note">該当する候補がありません</p>';
      return;
    }

    matches.forEach(p => {
      const item = document.createElement('div');
      item.className = 'result-item';
      item.innerHTML =
        '<div>' +
          '<div class="r-name"></div>' +
          '<div class="r-sub">' + p.count + '名' + (p.isLottery ? ' ・ 🎉抽選対象' : '') + '</div>' +
        '</div>' +
        '<span class="chip ' + (p.checked ? 'chip-checked' : 'chip-unchecked') + '">' +
          (p.checked ? '照会済み' : '未照会') +
        '</span>';
      // 氏名はtextContentで入れることでHTMLとして解釈されないようにする
      item.querySelector('.r-name').textContent = p.name;

      item.addEventListener('click', function () { checkInFromSearch(p); });
      listEl.appendChild(item);
    });
  }

  function checkInFromSearch(person) {
    // スキャン画面に戻してから、QRスキャンと全く同じ処理・演出を通す
    closeSearchView();

    // ローカルのインデックスも更新しておく(次回検索時の表示に反映するため)
    person.checked = true;

    lookupUser(person.id);
  }

  async function lookupUser(qrId) {
    isLookupInProgress = true;

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('info').classList.add('hidden');

    let waitCount = 0;
    while (!authToken && !authFailed && waitCount < 50) {
      await new Promise(r => setTimeout(r, 100));
      waitCount++;
    }

    if (!authToken) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('info').classList.remove('hidden');
      const nameEl = document.getElementById('res-name');
      nameEl.classList.remove('placeholder-row');
      nameEl.innerHTML = '<span class="res-error">認証エラー: ログインに失敗しました</span>';
      document.getElementById('res-dept').innerText = '';
      document.getElementById('res-badge').innerHTML = '';
      document.getElementById('lottery-banner').classList.add('hidden');
      playErrorSound();
      isLookupInProgress = false;
      return;
    }

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'lookup', token: authToken, qrId: qrId })
      });
      const data = await res.json();

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('info').classList.remove('hidden');
      const nameEl = document.getElementById('res-name');
      nameEl.classList.remove('placeholder-row');

      if (data.success) {
        nameEl.innerText = data.name;
        document.getElementById('res-dept').innerText = '人数: ' + data.count + '名';

        const badge = data.alreadyChecked
          ? '<span class="badge badge-warn">⚠ 照会済み（再スキャン）</span>'
          : '<span class="badge badge-ok">✓ 新規照会</span>';
        document.getElementById('res-badge').innerHTML = badge;

        const lotteryBanner = document.getElementById('lottery-banner');
        if (data.isLottery) {
          // 再生のたびにアニメーションが走るよう、一度クラスを外してから付け直す
          lotteryBanner.classList.remove('hidden');
          lotteryBanner.style.animation = 'none';
          void lotteryBanner.offsetWidth; // 強制リフロー(アニメーション再トリガーのため)
          lotteryBanner.style.animation = '';
          playLotterySound();
        } else {
          lotteryBanner.classList.add('hidden');
          playSuccessSound();
        }
      } else {
        nameEl.innerHTML = '<span class="res-error">' + data.message + '</span>';
        document.getElementById('res-dept').innerText = '';
        document.getElementById('res-badge').innerHTML = '';
        document.getElementById('lottery-banner').classList.add('hidden');

        playErrorSound();

        if (data.message.includes('認証エラー')) {
          authToken = null;
          sessionStorage.removeItem('auth_token');
          stopScannerAndReturnToLogin('セッションが切れました。再度ログインしてください');
        }
      }
    } finally {
      isLookupInProgress = false;
    }
  }
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入場券QR照会</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface-sunken: #FAF8F3;
    --border: #E2DDD1;
    --text: #1E2126;
    --text-dim: #767065;
    --accent: #1F3B57;
    --accent-soft: rgba(31,59,87,0.08);
    --success: #1F8A5F;
    --danger: #C0392B;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 40px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .brand .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
  }

  .card{
    position: relative;
    width:100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px 26px;
    box-shadow: 0 16px 40px -24px rgba(30,33,38,0.25);
  }

  .mute-btn{
    position: absolute;
    top: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-sunken);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .mute-btn:hover{ background: var(--accent-soft); }
  .mute-btn:active{ transform: scale(0.94); }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .subtitle{
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
    line-height:1.5;
  }

  /* ---- ログインフォーム ---- */
  .field{ margin-bottom: 14px; margin-top: 20px; }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .field input{
    width:100%;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input::placeholder{ color: #B5AE9F; }
  .field input:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .btn-primary{
    width:100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn-primary:hover{ filter: brightness(1.15); }
  .btn-primary:active{ transform: scale(0.98); }

  .error-msg{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top: 14px;
    padding: 11px 13px;
    background: rgba(192,57,43,0.07);
    border: 1px solid rgba(192,57,43,0.25);
    border-radius: 9px;
    color: var(--danger);
    font-size: 13px;
    line-height:1.4;
  }
  .error-msg::before{
    content:"!";
    flex-shrink:0;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--danger);
    color: #FFFFFF;
    font-size: 11px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .hidden{ display:none !important; }

  /* ---- スキャン画面全体の枠 ---- */
  .scan-frame{
    position: relative;
    width:100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  #reader{
    width:100% !important;
    background: var(--surface) !important;
  }

  #reader__scan_region{
    aspect-ratio: 1 / 1 !important;
    overflow: hidden !important;
    position: relative !important;
    background: #10131A !important;
  }
  #reader__scan_region video{
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }
  #reader img{ display:none; }

  /* html5-qrcode標準の白い縁取りを、デザインのアクセント色に変更 */
  div#qr-shaded-region > div{
    background-color: var(--accent) !important;
  }

  #reader__dashboard{
    background: var(--surface) !important;
    padding: 14px 4px 4px !important;
    color: var(--text-dim) !important;
    font-family: 'Inter', sans-serif !important;
  }
  #html5-qrcode-button-camera-stop,
  #html5-qrcode-button-camera-start{
    background: var(--accent) !important;
    color: #FFFFFF !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 10px 18px !important;
    font-family: 'Space Grotesk', sans-serif !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    cursor: pointer !important;
  }

  /* ---- 照会結果（画面上部に固定表示） ---- */
  .result-box{
    padding: 18px 18px 16px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 22px;
    min-height: 88px;
  }
  .result-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .result-label .pulse{
    width:7px; height:7px; border-radius:50%;
    background: var(--success);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(0.7); }
  }

  .loading-row{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 0;
  }
  .spinner{
    width:15px; height:15px;
    border-radius:50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .res-name{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .res-name.placeholder-row{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-dim);
  }
  .res-dept{
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  .res-error{
    color: var(--danger);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
  }

  .badge{
    display: inline-block;
    margin-top: 10px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
  }
  .badge-ok{
    background: rgba(31,138,95,0.1);
    color: var(--success);
    border: 1px solid rgba(31,138,95,0.3);
  }
  .badge-warn{
    background: rgba(232,179,57,0.12);
    color: #8A6512;
    border: 1px solid rgba(232,179,57,0.4);
  }

  /* ---- スキャン画面下部：タイトル・説明文・ブランド ---- */
  .header-bottom{
    margin-top: 22px;
    text-align: center;
  }
  .header-bottom .brand{
    justify-content: center;
    margin-top: 14px;
  }
</style>
</head>
<body>

  <div class="card">

    <!-- ログイン画面 -->
    <div id="login-area">
      <div class="brand" style="margin-bottom:18px;"><span class="dot"></span>SECURE CHECK-IN</div>
      <h1>入場券QRコード照会</h1>
      <p class="subtitle">配布したアカウントでログインし、QRコードをスキャンしてください。</p>

      <div class="field">
        <label for="login-id">ID</label>
        <input id="login-id" type="text" placeholder="employee ID" autocomplete="username"
               inputmode="latin" pattern="[A-Za-z0-9]*" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="login-pw">パスワード</label>
        <input id="login-pw" type="password" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') onLoginClick()">
      </div>

      <button class="btn-primary" onclick="onLoginClick()">ログインしてスキャン開始</button>
      <div id="login-error" class="error-msg hidden"></div>
    </div>

    <!-- スキャン画面：照会結果を最上部に固定表示、タイトル・ブランドは下部 -->
    <div id="scan-area" class="hidden">

      <button id="mute-toggle" class="mute-btn" onclick="toggleMute()" aria-label="音声のオン・オフを切り替え" type="button">🔊</button>

      <div id="result-box" class="result-box">
        <div id="loading" class="loading-row hidden">
          <span class="spinner"></span> 照会中...
        </div>
        <div id="info">
          <div class="result-label"><span class="pulse"></span>照会結果</div>
          <p class="res-name placeholder-row" id="res-name">QRコードをスキャンしてください</p>
          <p class="res-dept" id="res-dept"></p>
          <p id="res-badge"></p>
        </div>
      </div>

      <div class="scan-frame">
        <div id="reader"></div>
      </div>

      <div class="header-bottom">
        <h1>スキャン中</h1>
        <p class="subtitle">枠内にQRコードを収めてください。連続で読み取れます。</p>
        <div class="brand"><span class="dot"></span>SECURE CHECK-IN</div>
      </div>
    </div>

  </div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbw7wPLL-AJHJrlnXsg9MgaS3mG5CD3ZoWoIj-tMMr0afF3j8hl4PgwCc5oBuvpJJf09/exec';
  let authToken = null;
  let scannerInstance = null;
  let authFailed = false;
  let isLookupInProgress = false;
  let lastScannedId = null;
  let lastScanTime = 0;
  const SCAN_COOLDOWN_MS = 2500; // 同一QRコードの連続誤検出を防ぐための間隔

  // ---- 通知音（Web Audio APIでその場で合成。外部音源ファイルは一切使用しない） ----
  let audioCtx = null;
  let isMuted = sessionStorage.getItem('qr_scanner_muted') === 'true';

  function initAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
  }

  function playTone(frequency, duration, type, delay, volume) {
    if (isMuted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = frequency;

    const startTime = audioCtx.currentTime + (delay || 0);
    gain.gain.setValueAtTime(volume || 0.15, startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playSuccessSound() {
    // 明るく上昇する2音のチャイム
    playTone(880.0, 0.12, 'sine', 0, 0.16);
    playTone(1318.5, 0.16, 'sine', 0.09, 0.16);
  }

  function playErrorSound() {
    // 低めの2音のブザー
    playTone(220, 0.16, 'square', 0, 0.10);
    playTone(180, 0.22, 'square', 0.14, 0.10);
  }

  function toggleMute() {
    isMuted = !isMuted;
    sessionStorage.setItem('qr_scanner_muted', String(isMuted));
    updateMuteButton();
  }

  function updateMuteButton() {
    const btn = document.getElementById('mute-toggle');
    if (!btn) return;
    btn.textContent = isMuted ? '🔇' : '🔊';
    btn.setAttribute('aria-label', isMuted ? 'ミュート中（クリックで解除）' : '音声オン（クリックでミュート）');
  }
  updateMuteButton(); // 初期表示に反映

  // IDフィールド:全角英数字を自動的に半角に変換し、それ以外の文字は除去
  document.getElementById('login-id').addEventListener('input', function (e) {
    e.target.value = e.target.value
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
      .replace(/[^A-Za-z0-9]/g, '');
  });

  function onLoginClick() {
    const id = document.getElementById('login-id').value;
    const pw = document.getElementById('login-pw').value;

    if (!id || !pw) {
      showLoginError('IDとパスワードを入力してください');
      return;
    }

    document.getElementById('login-error').classList.add('hidden');
    authFailed = false;

    // AudioContextはユーザー操作の中で生成する必要があるため、ここで初期化する
    initAudio();

    // カメラをこのクリック操作の中で同期的に起動する（awaitを挟まない）
    document.getElementById('login-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
    startScanner();

    // 認証は裏で並行して進める
    doLogin(id, pw);
  }

  async function doLogin(id, pw) {
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'login', id: id, password: pw })
      });
      const data = await res.json();

      if (data.success) {
        authToken = data.token;
        sessionStorage.setItem('auth_token', authToken);
      } else {
        authFailed = true;
        stopScannerAndReturnToLogin(data.message);
      }
    } catch (err) {
      authFailed = true;
      stopScannerAndReturnToLogin('通信エラーが発生しました');
    }
  }

  function stopScannerAndReturnToLogin(message) {
    if (scannerInstance) {
      scannerInstance.clear().catch(() => {});
      scannerInstance = null;
    }
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('login-area').classList.remove('hidden');
    showLoginError(message);
  }

  function showLoginError(message) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = message;
    errEl.classList.remove('hidden');
  }

  function startScanner() {
    scannerInstance = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: 230,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] // 画像ファイル読込は使用しない
      }
    );
    scannerInstance.render((decodedText) => {
      if (authFailed || isLookupInProgress) return;

      const now = Date.now();
      // 同じQRコードを短時間に連続検出した場合は無視する（連続スキャンのための誤検出防止）
      if (decodedText === lastScannedId && (now - lastScanTime) < SCAN_COOLDOWN_MS) {
        return;
      }
      lastScannedId = decodedText;
      lastScanTime = now;

      lookupUser(decodedText);
      // pause/resumeは行わない：カメラを止めず、連続で次のQRコードを検出し続ける
    });
  }

  async function lookupUser(qrId) {
    isLookupInProgress = true;

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('info').classList.add('hidden');

    let waitCount = 0;
    while (!authToken && !authFailed && waitCount < 50) {
      await new Promise(r => setTimeout(r, 100));
      waitCount++;
    }

    if (!authToken) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('info').classList.remove('hidden');
      const nameEl = document.getElementById('res-name');
      nameEl.classList.remove('placeholder-row');
      nameEl.innerHTML = '<span class="res-error">認証エラー: ログインに失敗しました</span>';
      document.getElementById('res-dept').innerText = '';
      document.getElementById('res-badge').innerHTML = '';
      playErrorSound();
      isLookupInProgress = false;
      return;
    }

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'lookup', token: authToken, qrId: qrId })
      });
      const data = await res.json();

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('info').classList.remove('hidden');
      const nameEl = document.getElementById('res-name');
      nameEl.classList.remove('placeholder-row');

      if (data.success) {
        nameEl.innerText = data.name;
        document.getElementById('res-dept').innerText = data.dept;

        const badge = data.alreadyChecked
          ? '<span class="badge badge-warn">⚠ 入場済み（再入場）</span>'
          : '<span class="badge badge-ok">✓ 新規入場</span>';
        document.getElementById('res-badge').innerHTML = badge;

        playSuccessSound();
      } else {
        nameEl.innerHTML = '<span class="res-error">' + data.message + '</span>';
        document.getElementById('res-dept').innerText = '';
        document.getElementById('res-badge').innerHTML = '';

        playErrorSound();

        if (data.message.includes('認証エラー')) {
          authToken = null;
          sessionStorage.removeItem('auth_token');
          stopScannerAndReturnToLogin('セッションが切れました。再度ログインしてください');
        }
      }
    } finally {
      isLookupInProgress = false;
    }
  }
</script>
</body>
</html>

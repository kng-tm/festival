<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 mt-4">
    <h1 class="text-xl font-bold text-center mb-4">QR情報スキャナー</h1>

    <!-- ログイン画面 -->
    <div id="login-area">
      <input id="login-id" type="text" placeholder="ID" class="w-full border rounded p-2 mb-2">
      <input id="login-pw" type="password" placeholder="パスワード" 
       class="w-full border rounded p-2 mb-2"
       onkeydown="if(event.key==='Enter') onLoginClick()">
      <button onclick="onLoginClick()" class="w-full bg-blue-600 text-white font-bold py-2 rounded">
        ログインしてスキャン開始
      </button>
      <p id="login-error" class="text-red-600 text-sm mt-2 hidden"></p>
    </div>

    <!-- スキャン画面 -->
    <div id="scan-area" class="hidden">
      <div id="reader" class="w-full rounded-lg overflow-hidden" style="min-height:250px;"></div>
      <div id="result-box" class="mt-6 p-4 rounded-lg bg-gray-50 border hidden">
        <div id="loading" class="text-blue-600 font-semibold hidden">検索中...</div>
        <p class="text-lg font-bold"><span id="res-name"></span></p>
        <p class="text-sm text-gray-600"><span id="res-dept"></span></p>
      </div>
    </div>
  </div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzNDDXHgrpaZd8LIgYF7zaCJMjlFOLfjYq-7qFxtuVsVZr5Kd1map29Y3qTkKLpA3z7/exec';
  let authToken = null;
  let scannerInstance = null;
  let authFailed = false; // ログイン結果が返る前に照会が走らないようにするフラグ

  // ---- ボタン1回のクリックで「カメラ起動」と「ログイン認証」を並行して行う ----
  function onLoginClick() {
    const id = document.getElementById('login-id').value;
    const pw = document.getElementById('login-pw').value;

    if (!id || !pw) {
      showLoginError('IDとパスワードを入力してください');
      return;
    }

    document.getElementById('login-error').classList.add('hidden');
    authFailed = false;

    // ① カメラをこのクリック操作の中で同期的に起動する（awaitを挟まない）
    document.getElementById('login-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
    startScanner();

    // ② 認証は裏で並行して進める
    doLogin(id, pw);
  }

  // ---- ログイン処理（非同期） ----
  async function doLogin(id, pw) {
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'login', id: id, password: pw })
      });
      const data = await res.json();

      if (data.success) {
        authToken = data.token;
        sessionStorage.setItem('auth_token', authToken);
      } else {
        authFailed = true;
        stopScannerAndReturnToLogin(data.message);
      }
    } catch (err) {
      authFailed = true;
      stopScannerAndReturnToLogin('通信エラーが発生しました');
    }
  }

  // ---- 認証失敗時にカメラを止めてログイン画面へ戻す ----
  function stopScannerAndReturnToLogin(message) {
    if (scannerInstance) {
      scannerInstance.clear().catch(() => {});
      scannerInstance = null;
    }
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('login-area').classList.remove('hidden');
    showLoginError(message);
  }

  function showLoginError(message) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = message;
    errEl.classList.remove('hidden');
  }

  // ---- スキャナー起動処理 ----
  function startScanner() {
    scannerInstance = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: 250,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] // 画像ファイル読込を廃止し、カメラのみに限定
      }
    );
    scannerInstance.render((decodedText) => {
      if (authFailed) return; // 認証前に読み取られても無視
      scannerInstance.pause();
      lookupUser(decodedText);
    });
  }

  // ---- QR読み取り後の照会処理 ----
  async function lookupUser(qrId) {
    document.getElementById('result-box').classList.remove('hidden');
    document.getElementById('loading').classList.remove('hidden');

    // 認証がまだ完了していない場合は少し待つ（通常はカメラ起動より認証の方が早く終わる想定だが念のため）
    let waitCount = 0;
    while (!authToken && !authFailed && waitCount < 50) {
      await new Promise(r => setTimeout(r, 100));
      waitCount++;
    }

    if (!authToken) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('res-name').innerText = '認証エラー: ログインに失敗しました';
      document.getElementById('res-dept').innerText = '';
      return;
    }

    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'lookup', token: authToken, qrId: qrId })
    });
    const data = await res.json();

    document.getElementById('loading').classList.add('hidden');
    if (data.success) {
      document.getElementById('res-name').innerText = "氏名: " + data.name;
      document.getElementById('res-dept').innerText = "部署: " + data.dept;
    } else {
      document.getElementById('res-name').innerText = data.message;
      document.getElementById('res-dept').innerText = "";
      if (data.message.includes('認証エラー')) {
        authToken = null;
        sessionStorage.removeItem('auth_token');
        stopScannerAndReturnToLogin('セッションが切れました。再度ログインしてください');
      }
    }
  }
</script>
</body>
</html>

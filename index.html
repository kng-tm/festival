<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 mt-4">
    <h1 class="text-xl font-bold text-center mb-4">QR情報スキャナー</h1>

    <!-- ログイン画面 -->
    <div id="login-area">
      <input id="login-id" type="text" placeholder="ID" class="w-full border rounded p-2 mb-2">
      <input id="login-pw" type="password" placeholder="パスワード" class="w-full border rounded p-2 mb-2">
      <button onclick="doLogin()" class="w-full bg-blue-600 text-white font-bold py-2 rounded">ログイン</button>
      <p id="login-error" class="text-red-600 text-sm mt-2 hidden"></p>
    </div>

    <!-- ログイン後、まずはこのボタンだけを表示 -->
<div id="start-scan-area" class="hidden">
  <p class="text-center text-green-700 font-semibold mb-3">ログインしました</p>
  <button onclick="startScanner()" class="w-full bg-green-600 text-white font-bold py-3 rounded">
    カメラを起動してスキャン開始
  </button>
</div>

    <!-- スキャン画面 -->
    <div id="scan-area" class="hidden">
  <div id="reader" class="w-full rounded-lg overflow-hidden" style="min-height:250px;"></div>
  <div id="result-box" class="mt-6 p-4 rounded-lg bg-gray-50 border hidden">
        <div id="loading" class="text-blue-600 font-semibold hidden">検索中...</div>
        <p class="text-lg font-bold"><span id="res-name"></span></p>
        <p class="text-sm text-gray-600"><span id="res-dept"></span></p>
      </div>
    </div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzNDDXHgrpaZd8LIgYF7zaCJMjlFOLfjYq-7qFxtuVsVZr5Kd1map29Y3qTkKLpA3z7/exec';
  let authToken = null;

  async function doLogin() {
    const id = document.getElementById('login-id').value;
    const pw = document.getElementById('login-pw').value;
    document.getElementById('login-error').classList.add('hidden');

    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'login', id: id, password: pw })
    });
    const data = await res.json();

    if (data.success) {
      authToken = data.token;
      sessionStorage.setItem('auth_token', authToken); // タブ内リロード対策(ブラウザ再起動で消える)
      document.getElementById('login-area').classList.add('hidden');
      document.getElementById('scan-area').classList.remove('hidden');
      startScanner();
    } else {
      const errEl = document.getElementById('login-error');
      errEl.textContent = data.message;
      errEl.classList.remove('hidden');
    }
  }

  function startScanner() {
    document.getElementById('start-scan-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
  
    // 表示反映を1フレーム待ってから初期化する
    requestAnimationFrame(() => {
      const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      scanner.render((decodedText) => {
        scanner.pause();
        lookupUser(decodedText);
      });
    });
  }

  async function lookupUser(qrId) {
    document.getElementById('result-box').classList.remove('hidden');
    document.getElementById('loading').classList.remove('hidden');

    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'lookup', token: authToken, qrId: qrId })
    });
    const data = await res.json();

    document.getElementById('loading').classList.add('hidden');
    if (data.success) {
      document.getElementById('res-name').innerText = "氏名: " + data.name;
      document.getElementById('res-dept').innerText = "部署: " + data.dept;
    } else {
      document.getElementById('res-name').innerText = data.message;
      if (data.message.includes('認証エラー')) {
        // トークン切れの場合は再ログインを促す
        authToken = null;
        document.getElementById('scan-area').classList.add('hidden');
        document.getElementById('login-area').classList.remove('hidden');
      }
    }
  }
</script>
</body>
</html>

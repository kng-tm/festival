<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR情報照会</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface-sunken: #FAF8F3;
    --border: #E2DDD1;
    --text: #1E2126;
    --text-dim: #767065;
    --accent: #1F3B57;
    --accent-soft: rgba(31,59,87,0.08);
    --success: #1F8A5F;
    --danger: #C0392B;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 40px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 22px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .brand .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
  }

  .card{
    width:100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px 26px;
    box-shadow: 0 16px 40px -24px rgba(30,33,38,0.25);
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .subtitle{
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0 0 26px;
    line-height:1.5;
  }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .field input{
    width:100%;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input::placeholder{ color: #B5AE9F; }
  .field input:focus{
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .btn-primary{
    width:100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn-primary:hover{ filter: brightness(1.15); }
  .btn-primary:active{ transform: scale(0.98); }

  .error-msg{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top: 14px;
    padding: 11px 13px;
    background: rgba(192,57,43,0.07);
    border: 1px solid rgba(192,57,43,0.25);
    border-radius: 9px;
    color: var(--danger);
    font-size: 13px;
    line-height:1.4;
  }
  .error-msg::before{
    content:"!";
    flex-shrink:0;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--danger);
    color: #FFFFFF;
    font-size: 11px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .hidden{ display:none !important; }

  .scan-frame{
    position: relative;
    width:100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    background: #10131A;
    border: 1px solid var(--border);
  }
  /* html5-qrcode標準の白い縁取りを、デザインに合わせて紺色に変更 */
  #qr-shaded-region > div{
    background-color: var(--accent) !important;
  }
  #reader{ width:100% !important; height:100% !important; }
  #reader video{ object-fit: cover; }
  #reader img{ display:none; }
  #html5-qrcode-button-camera-stop,
  #html5-qrcode-button-camera-start{
    background: #FFFFFF !important;
    color: var(--accent) !important;
    border: 1.5px solid var(--accent) !important;
    border-radius: 8px !important;
    padding: 10px 18px !important;
    font-family: 'Space Grotesk', sans-serif !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    cursor: pointer !important;
  }
  #reader__scan_region{ background: #10131A !important; }
  .scan-frame #reader__dashboard{
    background: var(--surface) !important;
    padding: 14px 0 4px !important;
    color: var(--text-dim) !important;
    font-family: 'Inter', sans-serif !important;
  }

  .scan-caption{
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 16px;
    letter-spacing: 0.02em;
  }

  .result-box{
    margin-top: 20px;
    padding: 18px 18px 16px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .result-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .result-label .pulse{
    width:7px; height:7px; border-radius:50%;
    background: var(--success);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(0.7); }
  }

  .loading-row{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 0;
  }
  .spinner{
    width:15px; height:15px;
    border-radius:50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .res-name{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .res-dept{
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }
  .res-dept:empty, .res-name:empty{ display:none; }

  .res-error{
    color: var(--danger);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="brand"><span class="dot"></span>SECURE CHECK-IN</div>

  <div class="card">

    <!-- ログイン画面 -->
    <div id="login-area">
      <h1>QRコード情報照会</h1>
      <p class="subtitle">配布されたアカウントでログインし、QRコードをスキャンしてください。</p>

      <div class="field">
        <label for="login-id">ID</label>
        <input id="login-id" type="text" placeholder="employee ID" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-pw">パスワード</label>
        <input id="login-pw" type="password" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') onLoginClick()">
      </div>

      <button class="btn-primary" onclick="onLoginClick()">ログインしてスキャン開始</button>
      <div id="login-error" class="error-msg hidden"></div>
    </div>

    <!-- スキャン画面 -->
    <div id="scan-area" class="hidden">
      <h1>スキャン中</h1>
      <p class="subtitle">枠内にQRコードを収めてください。</p>

      <div class="scan-frame">
        <div id="reader"></div>
      </div>
      <p class="scan-caption">自動的に読み取られます</p>

      <div id="result-box" class="result-box hidden">
        <div id="loading" class="loading-row hidden">
          <span class="spinner"></span> 照会中...
        </div>
        <div id="info">
          <div class="result-label"><span class="pulse"></span>照会結果</div>
          <p class="res-name" id="res-name"></p>
          <p class="res-dept" id="res-dept"></p>
        </div>
      </div>
    </div>

  </div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzNDDXHgrpaZd8LIgYF7zaCJMjlFOLfjYq-7qFxtuVsVZr5Kd1map29Y3qTkKLpA3z7/exec';
  let authToken = null;
  let scannerInstance = null;
  let authFailed = false;

  function onLoginClick() {
    const id = document.getElementById('login-id').value;
    const pw = document.getElementById('login-pw').value;

    if (!id || !pw) {
      showLoginError('IDとパスワードを入力してください');
      return;
    }

    document.getElementById('login-error').classList.add('hidden');
    authFailed = false;

    document.getElementById('login-area').classList.add('hidden');
    document.getElementById('scan-area').classList.remove('hidden');
    startScanner();

    doLogin(id, pw);
  }

  async function doLogin(id, pw) {
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'login', id: id, password: pw })
      });
      const data = await res.json();

      if (data.success) {
        authToken = data.token;
        sessionStorage.setItem('auth_token', authToken);
      } else {
        authFailed = true;
        stopScannerAndReturnToLogin(data.message);
      }
    } catch (err) {
      authFailed = true;
      stopScannerAndReturnToLogin('通信エラーが発生しました');
    }
  }

  function stopScannerAndReturnToLogin(message) {
    if (scannerInstance) {
      scannerInstance.clear().catch(() => {});
      scannerInstance = null;
    }
    document.getElementById('scan-area').classList.add('hidden');
    document.getElementById('login-area').classList.remove('hidden');
    showLoginError(message);
  }

  function showLoginError(message) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = message;
    errEl.classList.remove('hidden');
  }

  function startScanner() {
    scannerInstance = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: 230,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
      }
    );
    scannerInstance.render((decodedText) => {
      if (authFailed) return;
      scannerInstance.pause();
      lookupUser(decodedText);
    });
  }

  async function lookupUser(qrId) {
    document.getElementById('result-box').classList.remove('hidden');
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('info').classList.add('hidden');

    let waitCount = 0;
    while (!authToken && !authFailed && waitCount < 50) {
      await new Promise(r => setTimeout(r, 100));
      waitCount++;
    }

    if (!authToken) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('info').classList.remove('hidden');
      document.getElementById('res-name').innerHTML = '<span class="res-error">認証エラー: ログインに失敗しました</span>';
      document.getElementById('res-dept').innerText = '';
      return;
    }

    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'lookup', token: authToken, qrId: qrId })
    });
    const data = await res.json();

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('info').classList.remove('hidden');

    if (data.success) {
      document.getElementById('res-name').innerText = data.name;
      document.getElementById('res-dept').innerText = data.dept;
    } else {
      document.getElementById('res-name').innerHTML = '<span class="res-error">' + data.message + '</span>';
      document.getElementById('res-dept').innerText = '';
      if (data.message.includes('認証エラー')) {
        authToken = null;
        sessionStorage.removeItem('auth_token');
        stopScannerAndReturnToLogin('セッションが切れました。再度ログインしてください');
      }
    }
  }
</script>
</body>
</html>
